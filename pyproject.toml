[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goad"
version = "2.0.0"
description = "Deploy and maintain one Active Directory lab on VMware Workstation with Packer and Ansible"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "rich>=13",
    "PyYAML>=6",
    "pypsrp>=0.8",
    "ansible-core>=2.16",
]

[project.scripts]
goad = "goad.cli:main"

[tool.setuptools.packages.find]
include = ["goad*"]

[tool.setuptools.package-data]
"goad.templates" = ["kali-prep.sh"]
