---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Uninstall acl-adminsdholder scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Revoke GenericAll"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_acl"
        tasks_from: remove
      vars:
        acl_principal: "{{ attacker }}"
        acl_target_dn: "CN=AdminSDHolder,CN=System,%DOMAIN%"
        acl_right: "GenericAll"
        acl_inheritance: "None"

    - name: "Run SDProp now so protected objects drop the ACE"
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $true
          $root = [ADSI]"LDAP://RootDSE"
          $root.Put("runProtectAdminGroupsTask", 1)
          $root.SetInfo()
      delegate_to: "{{ dc }}"

    - name: "Remove scenario users"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_ad"
        tasks_from: users
      vars:
        ad_users: ["{{ attacker }}"]
        ad_state: "absent"
