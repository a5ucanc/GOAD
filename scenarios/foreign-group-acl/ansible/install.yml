---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Install foreign-group-acl scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Create scenario groups"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_ad"
        tasks_from: groups
      vars:
        ad_groups: [{"name": "{{ group }}", "scope": "DomainLocal"}]
        ad_state: "present"

    - name: "Create {{ user }} in the partner forest and add it to {{ group }}"
      ansible.windows.win_powershell:
        script: |
          param([string]$Group, [string]$User, [string]$PartnerDc, [string]$PartnerUser, [string]$PartnerPassword, [string]$Password)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          Import-Module ActiveDirectory
          $cred = New-Object PSCredential($PartnerUser, (ConvertTo-SecureString $PartnerPassword -AsPlainText -Force))
          $u = Get-ADUser -LDAPFilter "(sAMAccountName=$User)" -Server $PartnerDc -Credential $cred
          if (-not $u) {
            $pdn = (Get-ADDomain -Server $PartnerDc -Credential $cred).DistinguishedName
            New-ADUser -Name $User -SamAccountName $User -Path "CN=Users,$pdn" -AccountPassword (ConvertTo-SecureString $Password -AsPlainText -Force) -Enabled $true -PasswordNeverExpires $true -Server $PartnerDc -Credential $cred
            $u = Get-ADUser -LDAPFilter "(sAMAccountName=$User)" -Server $PartnerDc -Credential $cred
            $Ansible.Changed = $true
          }
          $members = Get-ADGroup -Identity $Group -Properties member
          $fsp = "CN=$($u.SID.Value),CN=ForeignSecurityPrincipals,$((Get-ADDomain).DistinguishedName)"
          if ($members.member -notcontains $fsp) {
            # a principal of another forest is added by SID; AD creates the foreign security principal
            Set-ADObject -Identity $members.DistinguishedName -Add @{member = "<SID=$($u.SID.Value)>"}
            $Ansible.Changed = $true
          }
        parameters:
          Group: "{{ group }}"
          User: "{{ user }}"
          Password: "Aa1234567890!"
          PartnerDc: "{{ lab.hosts[lab.domains[partner].dc].hostname }}.{{ partner }}"
          PartnerUser: "{{ lab.domains[partner].netbios_name }}\\administrator"
          PartnerPassword: "{{ lab.domains[partner].domain_password }}"
      delegate_to: "{{ dc }}"
      no_log: true
      vars:
        partner: "{{ lab.domains[domain].trust }}"

    - name: "Grant GenericAll"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_acl"
        tasks_from: add
      vars:
        acl_principal: "{{ group }}"
        acl_target_dn: "CN={{ lab.hosts[dc].hostname }},OU=Domain Controllers,%DOMAIN%"
        acl_right: "GenericAll"
        acl_inheritance: "None"
