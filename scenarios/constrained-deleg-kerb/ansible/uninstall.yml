---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Uninstall constrained-deleg-kerb scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Remove the delegation values from the target computer"
      ansible.windows.win_powershell:
        script: |
          param([string]$Computer, [string[]]$Values, [string]$State)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          Import-Module ActiveDirectory
          $c = Get-ADComputer -Identity $Computer -Properties msDS-AllowedToDelegateTo
          foreach ($v in $Values) {
            $has = @($c.'msDS-AllowedToDelegateTo') -contains $v
            if ($State -eq 'present' -and -not $has) { Set-ADComputer -Identity $Computer -Add @{'msDS-AllowedToDelegateTo' = $v}; $Ansible.Changed = $true }
            if ($State -eq 'absent' -and $has) { Set-ADComputer -Identity $Computer -Remove @{'msDS-AllowedToDelegateTo' = $v}; $Ansible.Changed = $true }
          }
        parameters:
          Computer: "{{ lab.hosts[scenario_target].hostname }}$"
          Values: ["HTTP/{{ dc_fqdn }}", "HTTP/{{ lab.hosts[dc].hostname }}"]
          State: "absent"
      delegate_to: "{{ dc }}"
