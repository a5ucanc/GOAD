      users:
        scn-acl-wo-attacker:
          firstname: scn
          surname: acl-wo-attacker
          description: "Attacker: User with WriteOwner on a group"
          password: "Aa1234567890!"
      groups:
        scn-acl-wo-group:
          scope: global
      acls:
      - principal: scn-acl-wo-attacker
