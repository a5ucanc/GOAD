---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Install esc15 scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Grant Domain Users read on Web Server"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_acl"
        tasks_from: add
      vars:
        acl_principal: "{{ netbios }}\\Domain Users"
        acl_target_dn: "CN={{ template_cn }},CN=Certificate Templates,CN=Public Key Services,CN=Services,%CONFIG%"
        acl_right: "GenericRead"
        acl_inheritance: "None"

    - name: "Grant Domain Users enroll on Web Server"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_acl"
        tasks_from: add
      vars:
        acl_principal: "{{ netbios }}\\Domain Users"
        acl_target_dn: "CN={{ template_cn }},CN=Certificate Templates,CN=Public Key Services,CN=Services,%CONFIG%"
        acl_right: "Ext-Enroll"
        acl_inheritance: "None"
