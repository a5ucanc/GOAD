description: "User that can reset another user's password (ForceChangePassword)"
target: domain
fragment:
  domains:
    '{domain}':
      users:
        scn-acl-fcp-attacker:
          firstname: scn
          surname: acl-fcp-attacker
          description: "Attacker: User that can reset another user's password (ForceChangePassword)"
          password: "Aa1234567890!"
        scn-acl-fcp-victim:
          firstname: scn
          surname: acl-fcp-victim
          description: "Victim of acl-forcechangepassword"
          password: "Aa1234567890!"
      acls:
      - principal: scn-acl-fcp-attacker
        right: ForceChangePassword
        object: user:scn-acl-fcp-victim
