---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Install iis-upload scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Copy Default.aspx"
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../../../ad/GOAD/files/srv02/wwwroot/Default.aspx"
        dest: "C:\\inetpub\\wwwroot\\"

    - name: "Copy Web.config"
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../../../ad/GOAD/files/srv02/wwwroot/Web.config"
        dest: "C:\\inetpub\\wwwroot\\"

    - name: "Copy bin"
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../../../ad/GOAD/files/srv02/wwwroot/bin"
        dest: "C:\\inetpub\\wwwroot\\"

    - name: "Create the upload folder"
      ansible.windows.win_file:
        path: C:\inetpub\wwwroot\upload
        state: directory

    - name: "Give IIS_IUSRS full control on the upload folder"
      ansible.windows.win_acl:
        path: C:\inetpub\wwwroot\upload
        user: IIS_IUSRS
        rights: FullControl
        type: allow
        state: present
        inherit: ContainerInherit, ObjectInherit
        propagation: None
