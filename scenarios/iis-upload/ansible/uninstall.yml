---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Uninstall iis-upload scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Remove the upload application"
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          Import-Module WebAdministration
          $root = 'C:\inetpub\wwwroot'
          $items = @('Default.aspx', 'Web.config', 'bin', 'upload') | ForEach-Object { Join-Path $root $_ } | Where-Object { Test-Path $_ }
          if ($items) {
            # the app pool locks bin\*.dll
            $state = (Get-WebAppPoolState -Name DefaultAppPool).Value
            if ($state -eq 'Started') { Stop-WebAppPool -Name DefaultAppPool; while ((Get-WebAppPoolState -Name DefaultAppPool).Value -ne 'Stopped') { Start-Sleep -Seconds 1 } }
            foreach ($i in $items) { Remove-Item -Path $i -Recurse -Force }
            if ($state -eq 'Started') { Start-WebAppPool -Name DefaultAppPool }
            $Ansible.Changed = $true
          }
