---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Uninstall maq scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
  tasks:
    - name: "Apply uninstall value for each touched setting"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/base_setting"
      vars:
        setting_key: "{{ scenario_setting.key }}"
        setting_value: "{{ lab.base_settings[scenario_target][scenario_setting.key] }}"
      loop: "{{ touched_settings }}"
      loop_control:
        loop_var: scenario_setting

    # Computer accounts created through the quota carry mS-DS-CreatorSID. Base has none.
    - name: "Delete computer accounts created through the machine account quota"
      ansible.windows.win_powershell:
        error_action: stop
        script: |
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          Import-Module ActiveDirectory
          foreach ($c in Get-ADComputer -LDAPFilter '(mS-DS-CreatorSID=*)') {
            Remove-ADComputer -Identity $c.DistinguishedName -Confirm:$false
            $Ansible.Changed = $true
          }
