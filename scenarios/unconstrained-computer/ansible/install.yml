---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Install unconstrained-computer scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Trust the target computer for unconstrained delegation"
      ansible.windows.win_powershell:
        script: |
          param([string]$Computer, [string]$State)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          Import-Module ActiveDirectory
          $c = Get-ADComputer -Identity $Computer -Properties TrustedForDelegation
          $want = $State -eq 'present'
          if ($c.TrustedForDelegation -ne $want) { Set-ADAccountControl -Identity $c -TrustedForDelegation $want; $Ansible.Changed = $true }
        parameters:
          Computer: "{{ lab.hosts[scenario_target].hostname }}$"
          State: "present"
      delegate_to: "{{ dc }}"
