---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Install esc1 scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
  tasks:
    - name: "Install ADCSTemplate module"
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../../../ansible/roles/adcs_templates/files/ADCSTemplate"
        dest: "C:\\Program Files\\WindowsPowerShell\\Modules"

    - name: "Create setup directory"
      ansible.windows.win_file:
        path: C:\setup
        state: directory

    - name: "Copy template json"
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../../../ansible/roles/adcs_templates/files/{{ template_json }}"
        dest: "C:\\setup\\{{ template_json }}"

    - name: "Create and publish ESC1 template"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        if (-not (Get-ADCSTemplate -DisplayName "{{ template }}")) {
          New-ADCSTemplate -DisplayName "{{ template }}" -JSON (Get-Content C:\setup\{{ template_json }} -Raw) -Identity "{{ netbios }}\Domain Users" -Publish
        }
      vars:
        ansible_become: yes
        ansible_become_method: runas
        ansible_become_user: "{{ domain_username }}"
        ansible_become_password: "{{ domain_password }}"
