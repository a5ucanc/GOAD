---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Install acl-writedacl-ou scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Create scenario users"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_ad"
        tasks_from: users
      vars:
        ad_users: ["{{ attacker }}"]
        ad_state: "present"

    - name: "Create OU {{ ou }} with {{ victim }}"
      ansible.windows.win_powershell:
        script: |
          param([string]$Ou, [string]$Victim, [string]$Password)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          Import-Module ActiveDirectory
          $dn = (Get-ADDomain).DistinguishedName
          $ouDn = "OU=$Ou,$dn"
          if (-not (Get-ADOrganizationalUnit -LDAPFilter "(ou=$Ou)" -SearchBase $dn -SearchScope OneLevel)) {
            New-ADOrganizationalUnit -Name $Ou -Path $dn -ProtectedFromAccidentalDeletion $false
            $Ansible.Changed = $true
          }
          if (-not (Get-ADUser -LDAPFilter "(sAMAccountName=$Victim)")) {
            New-ADUser -Name $Victim -SamAccountName $Victim -Path $ouDn -AccountPassword (ConvertTo-SecureString $Password -AsPlainText -Force) -Enabled $true -PasswordNeverExpires $true
            $Ansible.Changed = $true
          }
        parameters:
          Ou: "{{ ou }}"
          Victim: "{{ victim }}"
          Password: "Aa1234567890!"
      delegate_to: "{{ dc }}"

    - name: "Grant WriteDacl"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_acl"
        tasks_from: add
      vars:
        acl_principal: "{{ attacker }}"
        acl_target_dn: "OU={{ ou }},%DOMAIN%"
        acl_right: "WriteDacl"
        acl_inheritance: "None"
