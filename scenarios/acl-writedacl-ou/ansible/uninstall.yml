---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Uninstall acl-writedacl-ou scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Remove OU {{ ou }} and its content ({{ victim }})"
      ansible.windows.win_powershell:
        script: |
          param([string]$Ou)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          Import-Module ActiveDirectory
          $dn = (Get-ADDomain).DistinguishedName
          $o = Get-ADOrganizationalUnit -LDAPFilter "(ou=$Ou)" -SearchBase $dn -SearchScope OneLevel
          if ($o) {
            Set-ADObject -Identity $o.DistinguishedName -ProtectedFromAccidentalDeletion $false
            Remove-ADObject -Identity $o.DistinguishedName -Recursive -Confirm:$false
            $Ansible.Changed = $true
          }
        parameters:
          Ou: "{{ ou }}"
      delegate_to: "{{ dc }}"

    - name: "Remove scenario users"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_ad"
        tasks_from: users
      vars:
        ad_users: ["{{ attacker }}"]
        ad_state: "absent"
