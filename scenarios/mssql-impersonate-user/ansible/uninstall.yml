---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Uninstall mssql-impersonate-user scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Drop the msdb user, the login and reset server options"
      ansible.windows.win_powershell:
        script: |
          param([string[]]$Statements)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          foreach ($q in $Statements) {
            $out = SqlCmd -S 127.0.0.1,1433 -E -b -Q $q 2>&1
            if ($LASTEXITCODE -ne 0) { throw "SqlCmd failed ($LASTEXITCODE): $q`n$out" }
            if ($out -match 'SCN_CHANGED') { $Ansible.Changed = $true }
          }
        parameters:
          Statements: ["USE msdb; IF EXISTS (SELECT 1 FROM sys.database_principals WHERE name = N'{{ netbios }}\\{{ user }}') BEGIN DROP USER [{{ netbios }}\\{{ user }}]; PRINT 'SCN_CHANGED' END", "DECLARE @s nvarchar(max) = N''; SELECT @s = @s + N'ALTER AUTHORIZATION ON DATABASE::' + QUOTENAME(name) + N' TO sa;' FROM sys.databases WHERE owner_sid = SUSER_SID(N'{{ netbios }}\\{{ user }}'); IF @s <> N'' BEGIN EXEC (@s); PRINT 'SCN_CHANGED' END", "DECLARE @k nvarchar(max) = N''; SELECT @k = @k + N'KILL ' + CAST(session_id AS nvarchar(10)) + N';' FROM sys.dm_exec_sessions WHERE login_name = N'{{ netbios }}\\{{ user }}'; IF @k <> N'' EXEC (@k)", "IF EXISTS (SELECT 1 FROM sys.server_principals WHERE name = N'{{ netbios }}\\{{ user }}') BEGIN DROP LOGIN [{{ netbios }}\\{{ user }}]; PRINT 'SCN_CHANGED' END", "IF EXISTS (SELECT 1 FROM sys.configurations WHERE name = 'xp_cmdshell' AND value_in_use = 1) BEGIN EXEC sp_configure 'show advanced options', 1; RECONFIGURE; EXEC sp_configure 'xp_cmdshell', 0; RECONFIGURE; PRINT 'SCN_CHANGED' END", "IF EXISTS (SELECT 1 FROM sys.configurations WHERE name = 'show advanced options' AND value_in_use = 1) BEGIN EXEC sp_configure 'show advanced options', 0; RECONFIGURE; PRINT 'SCN_CHANGED' END"]

    - name: "Remove scenario users"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_ad"
        tasks_from: users
      vars:
        ad_users: ["{{ user }}"]
        ad_state: "absent"
