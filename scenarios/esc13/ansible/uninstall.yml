---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Uninstall esc13 scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Remove template {{ template }}"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_adcs_template"
        tasks_from: remove

    - name: "Remove the {{ policy }} issuance policy"
      ansible.windows.win_powershell:
        script: |
          param([string]$Policy)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          Import-Module ActiveDirectory
          $config = (Get-ADRootDSE).configurationNamingContext
          foreach ($o in Get-ADObject -SearchBase "CN=OID,CN=Public Key Services,CN=Services,$config" -LDAPFilter "(displayName=$Policy)") {
            Remove-ADObject -Identity $o.DistinguishedName -Confirm:$false
            $Ansible.Changed = $true
          }
        parameters:
          Policy: "{{ policy }}"
      delegate_to: "{{ dc }}"

    - name: "Remove scenario groups"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_ad"
        tasks_from: groups
      vars:
        ad_groups: [{"name": "{{ group }}", "scope": "Universal"}]
        ad_state: "absent"
