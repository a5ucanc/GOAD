---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Install esc13 scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Create scenario groups"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_ad"
        tasks_from: groups
      vars:
        ad_groups: [{"name": "{{ group }}", "scope": "Universal", "member_of": ["Administrators"]}]
        ad_state: "present"

    - name: "Create template {{ template }}"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_adcs_template"
        tasks_from: add

    - name: "Link the issuance policy of {{ template }} to {{ group }}"
      ansible.windows.win_powershell:
        script: |
          param([string]$Template, [string]$Group, [string]$Policy)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          Import-Module ActiveDirectory
          $config = (Get-ADRootDSE).configurationNamingContext
          $oidPath = "CN=OID,CN=Public Key Services,CN=Services,$config"
          $oid = Get-ADObject -SearchBase $oidPath -LDAPFilter "(displayName=$Policy)" -Properties msPKI-Cert-Template-OID, msDS-OIDToGroupLink | Select-Object -First 1
          if (-not $oid) {
            $forest = (Get-ADObject -Identity $oidPath -Properties msPKI-Cert-Template-OID).'msPKI-Cert-Template-OID'
            $a = Get-Random -Minimum 10000000 -Maximum 99999999
            $b = Get-Random -Minimum 10000000 -Maximum 99999999
            $hex = -join ((1..32) | ForEach-Object { '{0:X}' -f (Get-Random -Maximum 16) })
            New-ADObject -Path $oidPath -Name "$b.$hex" -Type 'msPKI-Enterprise-Oid' -OtherAttributes @{
              'displayName' = $Policy; 'flags' = [int]2; 'msPKI-Cert-Template-OID' = "$forest.$a.$b" }
            $oid = Get-ADObject -SearchBase $oidPath -LDAPFilter "(displayName=$Policy)" -Properties msPKI-Cert-Template-OID, msDS-OIDToGroupLink | Select-Object -First 1
            $Ansible.Changed = $true
          }
          $value = $oid.'msPKI-Cert-Template-OID'
          $tpl = Get-ADObject -SearchBase "CN=Certificate Templates,CN=Public Key Services,CN=Services,$config" -LDAPFilter "(displayName=$Template)" -Properties msPKI-Certificate-Policy
          if (@($tpl.'msPKI-Certificate-Policy') -notcontains $value) {
            Set-ADObject -Identity $tpl.DistinguishedName -Replace @{'msPKI-Certificate-Policy' = $value}
            $Ansible.Changed = $true
          }
          $groupDn = (Get-ADGroup -Identity $Group).DistinguishedName
          if ($oid.'msDS-OIDToGroupLink' -ne $groupDn) {
            Set-ADObject -Identity $oid.DistinguishedName -Replace @{'msDS-OIDToGroupLink' = $groupDn}
            $Ansible.Changed = $true
          }
        parameters:
          Template: "{{ template }}"
          Group: "{{ group }}"
          Policy: "{{ policy }}"
      delegate_to: "{{ dc }}"
