---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Install mssql-sysadmin scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Create scenario users"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_ad"
        tasks_from: users
      vars:
        ad_users: ["{{ user }}"]
        ad_state: "present"

    - name: "Create the login and make it sysadmin"
      ansible.windows.win_powershell:
        script: |
          param([string[]]$Statements)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          foreach ($q in $Statements) {
            $out = SqlCmd -S 127.0.0.1,1433 -E -b -Q $q 2>&1
            if ($LASTEXITCODE -ne 0) { throw "SqlCmd failed ($LASTEXITCODE): $q`n$out" }
            if ($out -match 'SCN_CHANGED') { $Ansible.Changed = $true }
          }
        parameters:
          Statements: ["IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = N'{{ netbios }}\\{{ user }}') BEGIN CREATE LOGIN [{{ netbios }}\\{{ user }}] FROM WINDOWS; PRINT 'SCN_CHANGED' END", "IF NOT EXISTS (SELECT 1 FROM sys.server_role_members rm JOIN sys.server_principals r ON rm.role_principal_id = r.principal_id JOIN sys.server_principals m ON rm.member_principal_id = m.principal_id WHERE r.name = 'sysadmin' AND m.name = N'{{ netbios }}\\{{ user }}') BEGIN ALTER SERVER ROLE sysadmin ADD MEMBER [{{ netbios }}\\{{ user }}]; PRINT 'SCN_CHANGED' END"]
