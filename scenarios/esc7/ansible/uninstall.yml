---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Uninstall esc7 scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Revoke ManageCA and the user's certificates"
      ansible.windows.win_powershell:
        script: |
          param([string]$Identity)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          if (-not (Get-Module -ListAvailable -Name PSPKI)) { return }  # install never got far enough to add the ACE
          Import-Module PSPKI
          try { $sid = (New-Object Security.Principal.NTAccount $Identity).Translate([Security.Principal.SecurityIdentifier]) } catch { return }
          $ca = Get-CertificationAuthority -ComputerName ([Net.Dns]::GetHostByName($env:COMPUTERNAME).HostName)
          $acl = $ca | Get-CertificationAuthorityAcl
          $mine = @($acl.Access | Where-Object { $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]) -eq $sid })
          if ($mine.Count -gt 0) {
            $acl | Remove-CertificationAuthorityAcl -Identity $Identity -AccessType Allow | Set-CertificationAuthorityAcl -RestartCA | Out-Null
            $Ansible.Changed = $true
          }
          # certificates requested by the scenario user
          $rows = certutil -view -restrict "RequesterName=$Identity,Disposition=20" -out SerialNumber csv
          $serials = $rows | Select-Object -Skip 1 | ForEach-Object { $_.Trim().Trim('"') } | Where-Object { $_ -match '^[0-9a-fA-F]+$' }
          foreach ($s in $serials) { certutil -revoke $s 0 | Out-Null; $Ansible.Changed = $true }
          if ($serials) { certutil -crl | Out-Null }
        parameters:
          Identity: "{{ netbios }}\\{{ user }}"

    - name: "Remove scenario users"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_ad"
        tasks_from: users
      vars:
        ad_users: ["{{ user }}"]
        ad_state: "absent"
