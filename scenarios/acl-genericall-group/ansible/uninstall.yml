---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Uninstall acl-genericall-group scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Read SID of {{ group }}"
      ansible.windows.win_powershell:
        script: |
          param([string]$Name)
          $Ansible.Changed = $false
          $o = Get-ADObject -LDAPFilter "(sAMAccountName=$Name)" -Properties objectSid
          if ($o) { $o.objectSid.Value } else { '' }
        parameters:
          Name: "{{ group }}"
      delegate_to: "{{ dc }}"
      register: group_sid

    - name: "Remove {{ group }} from the local Administrators of the target"
      ansible.windows.win_powershell:
        script: |
          param([string]$Sid)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          if (-not $Sid) { return }
          $member = Get-LocalGroupMember -Group Administrators | Where-Object { $_.SID.Value -eq $Sid }
          if ($member) { Remove-LocalGroupMember -Group Administrators -Member $Sid; $Ansible.Changed = $true }
        parameters:
          Sid: "{{ group_sid.output[0] }}"

    - name: "Remove scenario groups"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_ad"
        tasks_from: groups
      vars:
        ad_groups: [{"name": "{{ group }}", "scope": "DomainLocal"}]
        ad_state: "absent"

    - name: "Remove scenario users"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_ad"
        tasks_from: users
      vars:
        ad_users: ["{{ attacker }}"]
        ad_state: "absent"
