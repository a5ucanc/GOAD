---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Install mssql-linked scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Create scenario users"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_ad"
        tasks_from: users
      vars:
        ad_users: ["{{ user }}"]
        ad_state: "present"

    - name: "Create the login and the linked server mapped to sa"
      ansible.windows.win_powershell:
        script: |
          param([string[]]$Statements)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          foreach ($q in $Statements) {
            $out = SqlCmd -S 127.0.0.1,1433 -E -b -Q $q 2>&1
            if ($LASTEXITCODE -ne 0) { throw "SqlCmd failed ($LASTEXITCODE): $q`n$out" }
            if ($out -match 'SCN_CHANGED') { $Ansible.Changed = $true }
          }
        parameters:
          Statements: ["IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = N'{{ netbios }}\\{{ user }}') BEGIN CREATE LOGIN [{{ netbios }}\\{{ user }}] FROM WINDOWS; PRINT 'SCN_CHANGED' END", "IF NOT EXISTS (SELECT 1 FROM sys.servers WHERE name = N'{{ lab.hosts[partner].hostname | upper }}') BEGIN EXEC sp_addlinkedserver @server = N'{{ lab.hosts[partner].hostname | upper }}', @srvproduct = N'', @provider = N'SQLOLEDB', @datasrc = N'{{ lab.hosts[partner].hostname }}.{{ lab.hosts[partner].domain }}'; EXEC sp_serveroption N'{{ lab.hosts[partner].hostname | upper }}', 'rpc', 'true'; EXEC sp_serveroption N'{{ lab.hosts[partner].hostname | upper }}', 'rpc out', 'true'; PRINT 'SCN_CHANGED' END", "IF NOT EXISTS (SELECT 1 FROM sys.linked_logins l JOIN sys.servers s ON l.server_id = s.server_id JOIN sys.server_principals p ON l.local_principal_id = p.principal_id WHERE s.name = N'{{ lab.hosts[partner].hostname | upper }}' AND p.name = N'{{ netbios }}\\{{ user }}') BEGIN EXEC sp_addlinkedsrvlogin @rmtsrvname = N'{{ lab.hosts[partner].hostname | upper }}', @locallogin = N'{{ netbios }}\\{{ user }}', @useself = N'False', @rmtuser = N'sa', @rmtpassword = N'{{ lab.hosts[partner].mssql.sa_password }}'; PRINT 'SCN_CHANGED' END"]
      no_log: true
      vars:
        partner: "{{ lab.capabilities.mssql | difference([scenario_target]) | first }}"
