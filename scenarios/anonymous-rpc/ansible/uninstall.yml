---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Uninstall anonymous-rpc scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Revoke anonymous ReadProperty on the domain root"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_acl"
        tasks_from: remove
      vars:
        acl_principal: "{{ principal }}"
        acl_target_dn: "%DOMAIN%"
        acl_right: "ReadProperty"
        acl_inheritance: "All"

    - name: "Revoke anonymous GenericExecute on the domain root"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_acl"
        tasks_from: remove
      vars:
        acl_principal: "{{ principal }}"
        acl_target_dn: "%DOMAIN%"
        acl_right: "GenericExecute"
        acl_inheritance: "All"
