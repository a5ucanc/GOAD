---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Uninstall gpo-abuse scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Unlink and delete GPO {{ gpo }}"
      ansible.windows.win_powershell:
        script: |
          param([string]$Gpo)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          Import-Module GroupPolicy
          $dn = (Get-ADDomain).DistinguishedName
          if ((Get-GPInheritance -Target $dn).GpoLinks | Where-Object DisplayName -eq $Gpo) {
            Remove-GPLink -Name $Gpo -Target $dn | Out-Null
            $Ansible.Changed = $true
          }
          if (Get-GPO -Name $Gpo -ErrorAction SilentlyContinue) {
            Remove-GPO -Name $Gpo
            $Ansible.Changed = $true
          }
        parameters:
          Gpo: "{{ gpo }}"
      delegate_to: "{{ dc }}"

    - name: "Remove scenario users"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_ad"
        tasks_from: users
      vars:
        ad_users: ["{{ attacker }}"]
        ad_state: "absent"
