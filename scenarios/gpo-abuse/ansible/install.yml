---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Install gpo-abuse scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Create scenario users"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_ad"
        tasks_from: users
      vars:
        ad_users: ["{{ attacker }}"]
        ad_state: "present"

    - name: "Create and link GPO {{ gpo }}, editable by {{ attacker }}"
      ansible.windows.win_powershell:
        script: |
          param([string]$Gpo, [string]$User)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          Import-Module GroupPolicy
          $dn = (Get-ADDomain).DistinguishedName
          $g = Get-GPO -Name $Gpo -ErrorAction SilentlyContinue
          if (-not $g) { $g = New-GPO -Name $Gpo -Comment 'GOAD scenario gpo-abuse'; $Ansible.Changed = $true }
          if (-not ((Get-GPInheritance -Target $dn).GpoLinks | Where-Object DisplayName -eq $Gpo)) {
            New-GPLink -Name $Gpo -Target $dn | Out-Null
            $Ansible.Changed = $true
          }
          $perm = Get-GPPermission -Name $Gpo -TargetName $User -TargetType User -ErrorAction SilentlyContinue
          if (-not $perm -or $perm.Permission -ne 'GpoEditDeleteModifySecurity') {
            Set-GPPermission -Name $Gpo -PermissionLevel GpoEditDeleteModifySecurity -TargetName $User -TargetType User | Out-Null
            $Ansible.Changed = $true
          }
        parameters:
          Gpo: "{{ gpo }}"
          User: "{{ attacker }}"
      delegate_to: "{{ dc }}"
