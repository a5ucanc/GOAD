---
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Uninstall rbcd scenario"
  hosts: scenario_target
  vars_files:
    - ../data/vars.yml
  vars:
    domain: "{{ lab.hosts[scenario_target].domain }}"
    domain_username: "{{ domain }}\\administrator"
    domain_password: "{{ lab.domains[domain].domain_password }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    dc_fqdn: "{{ lab.hosts[dc].hostname }}.{{ domain }}"
  tasks:
    - name: "Read SID of {{ attacker }}"
      ansible.windows.win_powershell:
        script: |
          param([string]$User)
          $Ansible.Changed = $false
          $u = Get-ADUser -LDAPFilter "(sAMAccountName=$User)"
          if ($u) { $u.SID.Value } else { '' }
        parameters:
          User: "{{ attacker }}"
      delegate_to: "{{ dc }}"
      register: attacker_sid

    - name: "Revoke GenericWrite"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_acl"
        tasks_from: remove
      vars:
        acl_principal: "{{ attacker }}"
        acl_target_dn: "sam:{{ lab.hosts[scenario_target].hostname }}$"
        acl_right: "GenericWrite"
        acl_inheritance: "None"

    - name: "Clear attack leftovers on the target computer"
      ansible.windows.win_powershell:
        script: |
          param([string]$Computer, [string]$CreatorSid)
          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false
          Import-Module ActiveDirectory
          # attack leftovers on the computer object: shadow credentials and RBCD (Base: both empty)
          $c = Get-ADComputer -Identity $Computer -Properties msDS-KeyCredentialLink, msDS-AllowedToActOnBehalfOfOtherIdentity
          if ($c.'msDS-KeyCredentialLink') { Set-ADComputer -Identity $Computer -Clear msDS-KeyCredentialLink; $Ansible.Changed = $true }
          if ($c.'msDS-AllowedToActOnBehalfOfOtherIdentity') { Set-ADComputer -Identity $Computer -Clear msDS-AllowedToActOnBehalfOfOtherIdentity; $Ansible.Changed = $true }
          if ($CreatorSid) {
            foreach ($pc in Get-ADComputer -LDAPFilter "(mS-DS-CreatorSID=$CreatorSid)") {
              Remove-ADObject -Identity $pc.DistinguishedName -Recursive -Confirm:$false
              $Ansible.Changed = $true
            }
          }
        parameters:
          Computer: "{{ lab.hosts[scenario_target].hostname }}$"
          CreatorSid: "{{ attacker_sid.output[0] }}"
      delegate_to: "{{ dc }}"

    - name: "Remove scenario users"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../../ansible/roles/scenario_ad"
        tasks_from: users
      vars:
        ad_users: ["{{ attacker }}"]
        ad_state: "absent"
