settings:
  all:
    net.llmnr: disabled
    net.nbtns: disabled
    net.mdns: disabled
    smb.signing: required
    smb.v1: disabled
    kerberos.rc4: disabled
    ntlm.lmcompat: 5
    defender.realtime: 'on'
    firewall.state: 'on'
    lsa.ppl: 'on'
  dc:
    host.tier: 0
    ldap.signing: required
    ldap.channel_binding: always
    dc.maq: 0
    dc.spooler: disabled
    dc.strong_cert_binding: 2
    dc.cert_mapping: absent
  server:
    host.tier: 1
    winrm.credssp: disabled
    net.webclient: absent
    defender.asr_lsass: block
hosts:
  dc01: {hostname: kingslanding, os: win2025, role: dc, domain: sevenkingdoms.local, octet: 10, cpus: 2, memory: 4096, ca: true, settings: {adcs.web_enrollment: 'off', adcs.editf_san: 'off', adcs.enforce_encrypt: 'on'}}
  dc02: {hostname: winterfell, os: win2025, role: dc, domain: north.sevenkingdoms.local, octet: 11, cpus: 2, memory: 4096}
  srv02: {hostname: castelblack, os: win2022, role: server, domain: north.sevenkingdoms.local, octet: 22, cpus: 2, memory: 4096, local_groups: {Administrators: ['NORTH\T1-ServerAdmins'], Remote Desktop Users: ['NORTH\Night Watch', 'NORTH\Mormont', 'NORTH\Stark']}}
