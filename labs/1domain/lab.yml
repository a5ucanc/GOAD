      cersei.lannister: {firstname: Cersei, surname: Lanister, city: 'King''s Landing', description: Cersei Lanister, ou: Crownlands, groups: [Lannister, Baratheon, Domain Admins, Small Council, T0-Admins, Protected Users], sensitive: true}
      tyron.lannister: {firstname: Tyron, surname: Lanister, city: 'King''s Landing', description: Tyron Lanister, ou: Westerlands, groups: [Lannister]}
      robert.baratheon: {firstname: Robert, surname: Baratheon, city: 'King''s Landing', description: Robert Lanister, ou: Crownlands, groups: [Baratheon, Domain Admins, Small Council, Protected Users, T0-Admins], sensitive: true}
