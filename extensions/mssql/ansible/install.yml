---
# read global configuration file and set up adapters
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

# The Base labs ship without SQL Server: this extension installs it on the
# hosts of the [mssql] group of its inventory. No vulnerable settings: no
# impersonation, no linked servers, only the domain Administrator is sysadmin.
- name: "Install MSSQL Express"
  hosts: mssql
  serial: 1 # one MSSQL install at a time to avoid issues
  vars:
    domain: "{{ lab.hosts[dict_key].domain }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    SQLSVCACCOUNT_NAME: "sql_svc"
    SQLSVCACCOUNT: "{{ netbios }}\\{{ SQLSVCACCOUNT_NAME }}"
    SQLSVCPASSWORD: "Aa1234567890!"
    SQLYSADMIN: "{{ SQLSVCACCOUNT }}"
    domain_admin: "{{ domain }}\\{{ admin_user }}"
    domain_admin_password: "{{ lab.domains[domain].domain_password }}"
    sql_sysadmins: ["{{ netbios }}\\Administrator"]
    executeaslogin: {}
    executeasuser: {}
    sa_password: "{{ mssql_sa_password }}"
  tasks:
    - name: "Create the SQL Server service account"
      ansible.builtin.include_role:
        name: scenario_ad
        tasks_from: users
      vars:
        ad_users: ["{{ SQLSVCACCOUNT_NAME }}"]
        ad_state: "present"
        ad_password: "{{ SQLSVCPASSWORD }}"

    - name: "Install SQL Server"
      ansible.builtin.include_role:
        name: mssql

- name: "Install SQL Server Management Studio"
  hosts: mssql_ssms
  roles:
    - { role: 'mssql_ssms', tags: 'mssql_ssms'}
