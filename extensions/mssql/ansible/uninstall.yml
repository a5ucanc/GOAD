---
# read global configuration file and set up adapters
- import_playbook: "../../../ansible/data.yml"
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

# Undo install.yml. Every task is idempotent: a second run on a clean host changes nothing.
- name: "Uninstall SQL Server Management Studio"
  hosts: mssql_ssms
  vars:
    ssms_installer: 'c:\setup\mssql\SSMS_installer.exe'
  tasks:
    - name: Check SSMS is installed
      ansible.windows.win_stat:
        path: "C:\\Program Files (x86)\\Microsoft SQL Server Management Studio 18"
      register: ssms_installation

    - name: Get the SSMS installer (it also uninstalls)
      ansible.windows.win_get_url:
        url: 'https://go.microsoft.com/fwlink/?linkid=2199013&clcid=0x409'
        dest: "{{ ssms_installer }}"
        force: false
      when: ssms_installation.stat.exists

    - name: Uninstall SSMS
      ansible.windows.win_command: '{{ ssms_installer }} /uninstall /quiet /norestart'
      register: ssms_uninstall
      # 3010: success, reboot required
      failed_when: ssms_uninstall.rc not in [0, 3010]
      when: ssms_installation.stat.exists

    - name: Reboot after SSMS uninstall
      ansible.windows.win_reboot:
        reboot_timeout: 600
      when: ssms_installation.stat.exists

- name: "Uninstall MSSQL Express"
  hosts: mssql
  serial: 1
  vars:
    domain: "{{ lab.hosts[dict_key].domain }}"
    netbios: "{{ lab.domains[domain].netbios_name }}"
    dc: "{{ lab.domains[domain].dc }}"
    sql_instance_name: SQLEXPRESS
    sql_service_name: "MSSQL${{ sql_instance_name }}"
    # SQL Server 2019 (the mssql role default) keeps its setup here after install
    sql_setup: 'C:\Program Files\Microsoft SQL Server\150\Setup Bootstrap\SQL2019\setup.exe'
  tasks:
    - name: Check the SQL Server service
      ansible.windows.win_service_info:
        name: "{{ sql_service_name }}"
      register: sql_service

    - name: Uninstall SQL Server
      ansible.windows.win_command: '"{{ sql_setup }}" /ACTION=Uninstall /FEATURES=SQLENGINE,FULLTEXT /INSTANCENAME={{ sql_instance_name }} /QUIET'
      register: sql_uninstall
      # 3010: success, reboot required
      failed_when: sql_uninstall.rc not in [0, 3010]
      when: sql_service.exists

    - name: Reboot after SQL Server uninstall
      ansible.windows.win_reboot:
        reboot_timeout: 1200
      when: sql_service.exists

    - name: Remove the MSSQL firewall rules
      community.windows.win_firewall_rule:
        name: "{{ item }}"
        state: absent
      loop:
        - "Access for MSSQL (TCP-In)"
        - "Access for MSSQL (UDP-In)"

    - name: Remove sql_svc from Log on as a service
      ansible.windows.win_user_right:
        name: SeServiceLogonRight
        users:
          - "{{ netbios }}\\sql_svc"
        action: remove
      # the account may already be gone after a partial run
      failed_when: false

    - name: Remove the SQL Server installer files
      ansible.windows.win_file:
        path: c:\setup\mssql
        state: absent

    - name: "Delete the SQL Server service account"
      ansible.builtin.include_role:
        name: scenario_ad
        tasks_from: users
      vars:
        ad_users: ["sql_svc"]
        ad_state: "absent"
