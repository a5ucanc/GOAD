# bento ubuntu boxes leave half of the disk unallocated in the LVM volume group.
# The vulnerability detection feed (about 20G while it unpacks) needs the space: grow the root logical volume to the whole volume group.
- name: Grow the root logical volume to the whole disk
  ansible.builtin.shell: |
    lv=$(findmnt -n -o SOURCE /)
    vg=$(lvs --noheadings -o vg_name "$lv" 2>/dev/null | tr -d ' ')
    [ -n "$vg" ] || exit 0
    free=$(vgs --noheadings --units b --nosuffix -o vg_free "$vg" | tr -d ' ')
    if [ "${free:-0}" -gt 1073741824 ]; then lvextend -r -l +100%FREE "$lv" && echo grown; fi
  register: grow_root
  changed_when: "'grown' in grow_root.stdout"

# use /opt/wazuh instead of /tmp to keep track
- name: Create /opt/wazuh directory if it does not exist
  ansible.builtin.file:
    path: /opt/wazuh
    state: directory
    mode: '0755'

# check existence to not reinstall if already installed
- name: Check services facts
  ansible.builtin.service_facts:

# - name: Print service facts
#   ansible.builtin.debug:
#     var: ansible_facts.services

- name: Download Wazuh installation script
  get_url:
    url: "{{ wazuh_install_script_url }}"
    dest: /opt/wazuh/wazuh-install.sh
  when: not ansible_facts.services['wazuh-manager.service'] is defined

- name: Run Wazuh installation script
  shell: sudo bash /opt/wazuh/wazuh-install.sh -a -i > /opt/wazuh/wazuh-install-output.txt
  when: not ansible_facts.services['wazuh-manager.service'] is defined

# FIX false positive on  /bin/diff  cf. https://github.com/wazuh/wazuh/issues/19000
- name: fix rootkit trojan detection due to issue
  ansible.builtin.lineinfile:
    path: /var/ossec/etc/rootcheck/rootkit_trojans.txt
    search_string: 'diff        !bash|^/bin/sh|file\.h|proc\.h|/dev/[^n]|^/bin/.*sh!'
    line: 'diff        !bash|^/bin/sh|file\.h|proc\.h|/dev/[^nf]|^/bin/.*sh!'

- name: Start Wazuh Manager service
  service:
    name: wazuh-manager
    state: started
    enabled: yes

# check socfotress folder to avoid reinstall if already installed
- name: Get stats of ossec directory
  ansible.builtin.stat:
    path: /var/ossec
  register: ossec_folder

- name: Download SOCFORTRESS Wazuh rules script
  copy:
    src: wazuh_socfortress_rules.sh
    dest: /opt/wazuh/wazuh_socfortress_rules.sh
    mode: "0755"  # Ensure the script is executable
  when: not ossec_folder.stat.exists

- name: Run SOCFORTRESS Wazuh rules script
  shell: sudo bash /opt/wazuh/wazuh_socfortress_rules.sh
  when: not ossec_folder.stat.exists

- name: Check if the indexer admin user already has the configured password
  ansible.builtin.uri:
    url: https://127.0.0.1:9200
    user: admin
    password: "{{ wazuh_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 401]
  register: wazuh_admin_check
  no_log: true

# Same steps as wazuh-passwords-tool.sh for the admin user, without its symbol check.
- name: Set the indexer admin user password
  ansible.builtin.shell: |
    set -e
    tools=/usr/share/wazuh-indexer/plugins/opensearch-security/tools
    certs=/etc/wazuh-indexer/certs
    export JAVA_HOME=/usr/share/wazuh-indexer/jdk OPENSEARCH_CONF_DIR=/etc/wazuh-indexer
    hash=$(bash $tools/hash.sh -p "$WAZUH_ADMIN_PASSWORD" 2>/dev/null | tail -1)
    mkdir -p /etc/wazuh-indexer/backup
    bash $tools/securityadmin.sh -backup /etc/wazuh-indexer/backup -icl -p 9200 -nhnv \
      -cacert $certs/root-ca.pem -cert $certs/admin.pem -key $certs/admin-key.pem -h 127.0.0.1
    sed -i "/^admin:/{n;s|hash: .*|hash: \"$hash\"|}" /etc/wazuh-indexer/backup/internal_users.yml
    bash $tools/securityadmin.sh -f /etc/wazuh-indexer/backup/internal_users.yml -t internalusers -icl -p 9200 -nhnv \
      -cacert $certs/root-ca.pem -cert $certs/admin.pem -key $certs/admin-key.pem -h 127.0.0.1
    # filebeat and the manager indexer connector log in as admin
    echo "$WAZUH_ADMIN_PASSWORD" | filebeat keystore add password --force --stdin
    /var/ossec/bin/wazuh-keystore -f indexer -k password -v "$WAZUH_ADMIN_PASSWORD"
    systemctl restart filebeat wazuh-manager
  args:
    executable: /bin/bash
  environment:
    WAZUH_ADMIN_PASSWORD: "{{ wazuh_admin_password }}"
  when: wazuh_admin_check.status != 200
  no_log: true

- name: Display username and password
  debug:
    msg:
      - "Username: admin"
      - "Password: {{ wazuh_admin_password }}"
