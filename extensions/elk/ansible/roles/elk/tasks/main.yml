# bento ubuntu boxes leave half of the disk unallocated in the LVM volume group.
# Elasticsearch data needs the space: grow the root logical volume to the whole volume group.
- name: Grow the root logical volume to the whole disk
  ansible.builtin.shell: |
    lv=$(findmnt -n -o SOURCE /)
    vg=$(lvs --noheadings -o vg_name "$lv" 2>/dev/null | tr -d ' ')
    [ -n "$vg" ] || exit 0
    free=$(vgs --noheadings --units b --nosuffix -o vg_free "$vg" | tr -d ' ')
    if [ "${free:-0}" -gt 1073741824 ]; then lvextend -r -l +100%FREE "$lv" && echo grown; fi
  register: grow_root
  changed_when: "'grown' in grow_root.stdout"

- name: "Update cache"
  apt:
    update_cache: true
    cache_valid_time: 86400

- name: Add required dependencies.
  apt:
    name:
      - apt-transport-https
      - gnupg2
    state: present
    update_cache: yes

- name: Add Elasticsearch apt key.
  get_url:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    dest: /etc/apt/keyrings/elasticsearch.asc
    mode: '0644'

- name: Add Elasticsearch repository.
  apt_repository:
    repo: 'deb [signed-by=/etc/apt/keyrings/elasticsearch.asc] https://artifacts.elastic.co/packages/{{ elasticsearch_version }}/apt stable main'
    state: present
    update_cache: true

# Elasticsearch, Logstash and Kibana 8+ bundle their own JDK: no java package needed.
- name: Install logstash
  apt:
    name: logstash
    state: present

- name: Install elasticsearch
  apt:
    name: elasticsearch
    state: present

- name: Install kibana
  apt:
    name: kibana
    state: present

- name: copy kibana config
  template:
    src: kibana.yml.j2
    dest: /etc/kibana/kibana.yml
    owner: "root"
    group: "kibana"
    mode: 0660
  notify: restart kibana

- name: copy elasticsearch config
  copy:
    src: elasticsearch.yml
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: "root"
    group: "elasticsearch"
    mode: 0660
  notify: restart elasticsearch

- name: set elasticsearch heap size
  copy:
    dest: /etc/elasticsearch/jvm.options.d/heap.options
    content: |
      -Xms{{ es_heap_size }}
      -Xmx{{ es_heap_size }}
    owner: "root"
    group: "elasticsearch"
    mode: 0660
  notify: restart elasticsearch

# The package auto-configuration stores TLS keystore passwords. TLS is disabled in
# our elasticsearch.yml, so remove them or elasticsearch refuses the leftover ssl settings.
- name: list elasticsearch keystore entries
  command: /usr/share/elasticsearch/bin/elasticsearch-keystore list
  register: es_keystore
  changed_when: false

- name: remove auto-configured TLS entries from the elasticsearch keystore
  command: "/usr/share/elasticsearch/bin/elasticsearch-keystore remove {{ item }}"
  loop:
    - xpack.security.http.ssl.keystore.secure_password
    - xpack.security.transport.ssl.keystore.secure_password
    - xpack.security.transport.ssl.truststore.secure_password
  when: item in es_keystore.stdout_lines
  notify: restart elasticsearch

# File-realm superuser, used below to set the built-in users passwords through the API.
- name: list elasticsearch file-realm users
  command: /usr/share/elasticsearch/bin/elasticsearch-users list
  register: es_file_users
  changed_when: false

- name: create the bootstrap file-realm superuser
  command: >-
    /usr/share/elasticsearch/bin/elasticsearch-users useradd {{ elk_bootstrap_user }}
    -p {{ elk_bootstrap_password }} -r superuser
  when: es_file_users.stdout is not search('^' ~ elk_bootstrap_user ~ '\\s', multiline=True)
  no_log: true

- name: enable logstash
  service:
    name: logstash
    enabled: yes

- name: enable elasticsearch
  service:
    name: elasticsearch
    enabled: yes

- name: enable kibana
  service:
    name: kibana
    enabled: yes

- name: start logstash
  service:
    name: logstash
    state: started

- name: start elasticsearch
  service:
    name: elasticsearch
    state: started

- name: apply pending elasticsearch restart
  meta: flush_handlers

- name: wait for elasticsearch to answer
  uri:
    url: http://localhost:9200/_cluster/health
    user: "{{ elk_bootstrap_user }}"
    password: "{{ elk_bootstrap_password }}"
    force_basic_auth: true
  register: es_health
  until: es_health.status == 200
  retries: 30
  delay: 10

- name: set the built-in users passwords
  uri:
    url: "http://localhost:9200/_security/user/{{ item.user }}/_password"
    method: POST
    user: "{{ elk_bootstrap_user }}"
    password: "{{ elk_bootstrap_password }}"
    force_basic_auth: true
    body_format: json
    body:
      password: "{{ item.password }}"
  loop:
    - { user: elastic, password: "{{ elk_elastic_password }}" }
    - { user: kibana_system, password: "{{ elk_kibana_system_password }}" }
  no_log: true

- name: start kibana
  service:
    name: kibana
    state: started
