# Elasticsearch 9.x configuration for the GOAD elk extension.
# This file replaces the one written by the package security auto-configuration.
path.data: /var/lib/elasticsearch
path.logs: /var/log/elasticsearch

network.host: 0.0.0.0
http.port: 9200

# Single node: no bootstrap checks and no transport TLS requirement.
discovery.type: single-node

# Security stays on (authentication required) but without TLS, so the lab
# agents can ship logs over plain http with a username and password.
xpack.security.enabled: true
xpack.security.enrollment.enabled: false
xpack.security.http.ssl.enabled: false
xpack.security.transport.ssl.enabled: false
