# goad-v2 provisioning. Play names, hosts and order are fixed; later tasks add their roles.
- name: common
  hosts: windows
  gather_facts: false
  strategy: linear
  tags: [common]
  roles:
    # Every run (any --tags) must pick the login that works on unjoined members.
    - role: connect
      when: inventory_hostname in groups.member
      tags: [always]
    - common

- name: forest
  hosts: forest_root
  gather_facts: false
  strategy: linear
  tags: [forest]
  roles:
    - forest

- name: child
  hosts: child_dc
  gather_facts: false
  strategy: linear
  tags: [child]
  roles:
    - child_domain

- name: trust
  hosts: dc
  gather_facts: false
  strategy: linear
  tags: [trust]
  pre_tasks:
    # Child promotion (play child) writes glue for the child DC, nat address included, into the
    # parent zone after the forest root ran dc_dns. Clean that zone again now.
    - name: Remove A records of non-lab addresses from the parent zone
      ansible.builtin.include_role:
        name: dc_dns
        tasks_from: records
        apply:
          tags: [trust]
      when: inventory_hostname in groups.forest_root
  roles:
    - trust

- name: join and content
  hosts: dc:member
  gather_facts: false
  strategy: free
  tags: [join, content]
  roles:
    - role: join
      when: inventory_hostname in groups.member
    # Starts the AD CS role install and returns; the adcs role (settings play) waits for it. Started
    # here, not beside the child promotion, which it slowed by replicating load on the parent DC.
    - role: ca_feature
      when: ca
      tags: [adcs]
    - role: ad_content
      when: inventory_hostname in groups.dc

- name: foreign members
  hosts: dc
  gather_facts: false
  strategy: linear
  tags: [content]
  roles:
    - foreign_members
    # Members have joined by now (join and content is free, so not while ad_content runs).
    - ad_computers
    # Last: ACEs name users, groups, OUs, GPOs and joined computer accounts.
    - ad_acls

- name: post-join
  hosts: windows
  gather_facts: false
  strategy: linear
  tags: [laps, local_groups]
  roles:
    - role: laps_schema
      when: laps_schema | default(false)
    - role: laps_dc
      when: inventory_hostname in groups.dc and goad_domains[domain].laps_hosts | length > 0
    - local_groups
    - role: laps_host
      when: laps

- name: settings
  hosts: windows
  gather_facts: false
  strategy: free
  # A reboot notified before a later task fails must still run: the re-run finds the value set.
  force_handlers: true
  tags: [settings]
  roles:
    # Here, not in the linear post-join play, where its wait for the CA role install held every
    # host. In this free play the other hosts apply their settings meanwhile.
    - role: adcs
      when: ca
      tags: [adcs]
    - settings
