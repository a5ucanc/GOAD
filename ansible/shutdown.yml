# Shut hosts down from inside with the inventory credentials. Used to halt a base lab whose
# vagrant account is disabled: `vagrant halt` would need that account. goad waits for VMware to
# report the VMs off, so the tasks only start the shutdown.
- name: "Shut down"
  hosts: shutdown_target
  gather_facts: no
  ignore_unreachable: true
  tasks:
    - name: "Shut down Windows"
      ansible.windows.win_command: shutdown.exe /s /t 5 /f
      when: ansible_connection | default('') == 'winrm'

    - name: "Shut down Linux"
      ansible.builtin.shell: sleep 2 && shutdown -h now
      async: 30
      poll: 0
      become: yes
      when: ansible_connection | default('') != 'winrm'
