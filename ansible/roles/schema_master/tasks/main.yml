# Lets the schema master of a forest accept schema changes. Include it right before one (LAPS, Exchange).
#
# After goad restores the DCs from a snapshot (VM-GenerationID change), the schema master refuses schema
# changes until it has replicated inbound with a partner: event 2092, ldifde 0x21a2 "The FSMO role
# ownership could not be verified because its directory partition has not replicated successfully with
# at least one replication partner". AD's own retry, after the DNS failure at boot, can take an hour.
# Pull every partition inbound (no /P: push would not validate this DC's role), then retry until the
# last inbound replication of the Schema partition succeeded. A forest with a single DC has no partner
# and no check to pass.
#
# Runs on the forest-root DC (delegated from a member) with the full logon of become: repadmin makes
# RPC calls to the DCs, which WinRM's network logon cannot (Access is denied, double hop).
- name: Sync the schema master with its replication partners
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      # Native exit codes do not throw; the replication state below decides
      repadmin /syncall $env:COMPUTERNAME /Ade 2>&1 | Out-Null
      $rows = @(repadmin /showrepl $env:COMPUTERNAME /csv 2>&1 | ConvertFrom-Csv)
      $global:LASTEXITCODE = 0
      $errors = @($rows | Where-Object { @($_.PSObject.Properties)[0].Value -eq 'showrepl_ERROR' })
      if ($errors.Count) { throw "repadmin /showrepl reported errors: $($errors | Out-String)" }
      $schema = @($rows | Where-Object { $_.'Naming Context' -like 'CN=Schema,*' })
      if (-not $schema.Count) {
          # No Schema row: only a forest with a single DC has no partner. Anything else is an unsynced or unreadable state
          $dcs = @((Get-ADForest).Domains | ForEach-Object { Get-ADDomainController -Filter * -Server $_ })
          if ($dcs.Count -gt 1) { throw "No Schema replication state, but the forest has $($dcs.Count) DCs" }
      } else {
          # A success before the boot is stale repsFrom data from before a snapshot restore
          $boot = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime
          $fresh = $schema | Where-Object {
              $t = [datetime]::MinValue
              $_.'Number of Failures' -eq '0' -and [datetime]::TryParse($_.'Last Success Time', [ref]$t) -and $t -gt $boot
          }
          if (-not $fresh) { throw "The Schema partition has not replicated from any partner since boot yet: $($schema | Out-String)" }
      }
  delegate_to: "{{ goad_domains[schema_master_domain].dc }}"
  become: true
  become_method: ansible.builtin.runas
  become_user: "{{ goad_domains[schema_master_domain].netbios }}\\Administrator"
  vars:
    ansible_become_password: "{{ lab_password }}"
  register: schema_master_sync
  retries: 20
  delay: 30
  until: schema_master_sync is not failed
  changed_when: false
