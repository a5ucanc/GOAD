# Account attributes set after the users exist. Each task loops only over the entries that carry
# the attribute, so a lab without them runs nothing here. Add only: nothing is removed.
- name: User SPNs
  ansible.windows.win_powershell:
    parameters:
      Name: "{{ item.key }}"
      Spns: "{{ item.value.spns }}"
    script: |
      param([string]$Name, [string[]]$Spns)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $u = Get-ADUser -Identity $Name -Properties servicePrincipalName
      foreach ($spn in $Spns) {
          if (@($u.servicePrincipalName) -notcontains $spn) {
              Set-ADUser -Identity $u -ServicePrincipalNames @{Add = $spn}
              $Ansible.Changed = $true
          }
      }
  loop: "{{ goad_domains[domain].users | dict2items | selectattr('value.spns', 'defined') | list }}"
  loop_control:
    label: "{{ item.key }}"

- name: Users without Kerberos pre-authentication
  ansible.windows.win_powershell:
    parameters:
      Name: "{{ item.key }}"
    script: |
      param([string]$Name)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $u = Get-ADUser -Identity $Name -Properties DoesNotRequirePreAuth
      if (-not $u.DoesNotRequirePreAuth) {
          Set-ADAccountControl -Identity $u -DoesNotRequirePreAuth $true
          $Ansible.Changed = $true
      }
  loop: "{{ goad_domains[domain].users | dict2items | selectattr('value.preauth', 'defined') | rejectattr('value.preauth') | list }}"
  loop_control:
    label: "{{ item.key }}"

# files/delegation.ps1 ports main's delegation scenarios; computers.yml applies it to computer accounts.
- name: User delegation
  ansible.windows.win_powershell:
    parameters:
      Kind: user
      Name: "{{ item.key }}"
      Unconstrained: "{{ item.value.delegation.unconstrained }}"
      Constrained: "{{ item.value.delegation.constrained }}"
      ProtocolTransition: "{{ item.value.delegation.protocol_transition }}"
    script: "{{ lookup('ansible.builtin.file', 'delegation.ps1') }}"
  loop: "{{ goad_domains[domain].users | dict2items | selectattr('value.delegation', 'defined') | list }}"
  loop_control:
    label: "{{ item.key }}"

# Parents are same-domain groups (created above) or built-ins such as Administrators.
- name: Group nesting
  ansible.windows.win_powershell:
    parameters:
      Name: "{{ item.0.key }}"
      Parent: "{{ item.1 }}"
    script: |
      param([string]$Name, [string]$Parent)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $parentDn = (Get-ADGroup -Identity $Parent).DistinguishedName
      if (@((Get-ADGroup -Identity $Name -Properties MemberOf).MemberOf) -notcontains $parentDn) {
          Add-ADGroupMember -Identity $Parent -Members (Get-ADGroup -Identity $Name)
          $Ansible.Changed = $true
      }
  loop: "{{ goad_domains[domain].groups | dict2items | selectattr('value.member_of', 'defined') | list | subelements('value.member_of') }}"
  loop_control:
    label: "{{ item.0.key }} in {{ item.1 }}"
