- name: "Check accepted values for ntlm.lmcompat"
  ansible.builtin.assert:
    that: "(setting_value | string) in ['0', '1', '2', '3', '4', '5']"
    fail_msg: "Invalid value '{{ setting_value }}' for ntlm.lmcompat, accepted: ['0', '1', '2', '3', '4', '5']"
    quiet: true

- name: "Set LmCompatibilityLevel"
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: LmCompatibilityLevel
    data: "{{ setting_value | int }}"
    type: dword
    state: present
