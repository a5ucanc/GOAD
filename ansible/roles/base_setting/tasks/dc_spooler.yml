- name: "Check accepted values for dc.spooler"
  ansible.builtin.assert:
    that: "(setting_value | string) in ['disabled', 'enabled']"
    fail_msg: "Invalid value '{{ setting_value }}' for dc.spooler, accepted: ['disabled', 'enabled']"
    quiet: true

- name: "Set Print Spooler service"
  ansible.windows.win_service:
    name: Spooler
    start_mode: "{{ 'disabled' if setting_value | string == 'disabled' else 'auto' }}"
    state: "{{ 'stopped' if setting_value | string == 'disabled' else 'started' }}"
