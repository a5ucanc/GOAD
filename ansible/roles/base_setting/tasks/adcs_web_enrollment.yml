- name: "Check accepted values for adcs.web_enrollment"
  ansible.builtin.assert:
    that: "(setting_value | string) in ['false', 'true']"
    fail_msg: "Invalid value '{{ setting_value }}' for adcs.web_enrollment, accepted: ['false', 'true']"
    quiet: true

- name: "Install ADCS web enrollment"
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $feature = Get-WindowsFeature ADCS-Web-Enrollment
      if (-not $feature.Installed) {
        Install-WindowsFeature ADCS-Web-Enrollment -IncludeManagementTools | Out-Null
        $Ansible.Changed = $true
      }
      if (-not (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\CertSvc\Configuration')) { throw 'No CA configured' }
      if (-not (Get-WebApplication -Site 'Default Web Site' -Name 'CertSrv' -ErrorAction SilentlyContinue)) {
        Install-AdcsWebEnrollment -Force | Out-Null
        $Ansible.Changed = $true
      }
  when: setting_value | string == 'true'
  vars:
    ansible_become: yes
    ansible_become_method: runas
    ansible_become_user: "{{domain_username}}"
    ansible_become_password: "{{domain_password}}"

- name: "Allow NTLM over HTTP on /certsrv, EPA off"
  ansible.windows.win_powershell:
    script: |
      Import-Module WebAdministration
      $Ansible.Changed = $false
      $f = 'system.webServer/security/authentication/windowsAuthentication'
      $loc = 'Default Web Site/CertSrv'
      Set-WebConfigurationProperty -PSPath IIS:\ -Location $loc -Filter $f -Name enabled -Value $true
      $pr = Get-WebConfigurationProperty -PSPath IIS:\ -Location $loc -Filter "$f/providers" -Name '.' 
      if (-not ($pr.Collection | Where-Object { $_.Value -eq 'NTLM' })) {
        Add-WebConfiguration -PSPath IIS:\ -Location $loc -Filter "$f/providers" -Value @{value='NTLM'}
        $Ansible.Changed = $true
      }
      $epa = Get-WebConfigurationProperty -PSPath IIS:\ -Location $loc -Filter "$f/extendedProtection" -Name tokenChecking
      if ($epa -ne 'None') {
        Set-WebConfigurationProperty -PSPath IIS:\ -Location $loc -Filter "$f/extendedProtection" -Name tokenChecking -Value 'None'
        $Ansible.Changed = $true
      }
      $ssl = Get-WebConfigurationProperty -PSPath IIS:\ -Location $loc -Filter 'system.webServer/security/access' -Name sslFlags
      if ("$ssl" -ne 'None' -and "$ssl" -ne '') {
        Set-WebConfigurationProperty -PSPath IIS:\ -Location $loc -Filter 'system.webServer/security/access' -Name sslFlags -Value 'None'
        $Ansible.Changed = $true
      }
  when: setting_value | string == 'true'
  vars:
    ansible_become: yes
    ansible_become_method: runas
    ansible_become_user: "{{domain_username}}"
    ansible_become_password: "{{domain_password}}"

- name: "Uninstall ADCS web enrollment"
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      if ((Get-WindowsFeature ADCS-Web-Enrollment).Installed) {
        Uninstall-AdcsWebEnrollment -Force | Out-Null
        Uninstall-WindowsFeature ADCS-Web-Enrollment | Out-Null
        $Ansible.Changed = $true
      }
  when: setting_value | string == 'false'
  vars:
    ansible_become: yes
    ansible_become_method: runas
    ansible_become_user: "{{domain_username}}"
    ansible_become_password: "{{domain_password}}"
