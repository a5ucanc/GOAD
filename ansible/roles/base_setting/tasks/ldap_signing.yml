- name: "Check accepted values for ldap.signing"
  ansible.builtin.assert:
    that: "(setting_value | string) in ['required', 'none']"
    fail_msg: "Invalid value '{{ setting_value }}' for ldap.signing, accepted: ['required', 'none']"
    quiet: true

- name: "Set LDAP server signing"
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\NTDS\Parameters
    name: LDAPServerIntegrity
    data: "{{ 2 if setting_value | string == 'required' else 1 }}"
    type: dword
    state: present
