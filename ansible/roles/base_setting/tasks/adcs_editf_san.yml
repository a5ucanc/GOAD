- name: "Check accepted values for adcs.editf_san"
  ansible.builtin.assert:
    that: "(setting_value | string) in ['off', 'on']"
    fail_msg: "Invalid value '{{ setting_value }}' for adcs.editf_san, accepted: ['off', 'on']"
    quiet: true

- name: "Read current EditFlags"
  ansible.windows.win_command: certutil -getreg policy\EditFlags
  register: editf_current
  changed_when: false
  failed_when: false
  vars:
    ansible_become: yes
    ansible_become_method: runas
    ansible_become_user: "{{domain_username}}"
    ansible_become_password: "{{domain_password}}"

- name: "Set EDITF_ATTRIBUTESUBJECTALTNAME2"
  ansible.windows.win_command: "certutil -setreg policy\\EditFlags {{ '+' if setting_value | string == 'on' else '-' }}EDITF_ATTRIBUTESUBJECTALTNAME2"
  when: >-
    ('EDITF_ATTRIBUTESUBJECTALTNAME2' in editf_current.stdout) != (setting_value | string == 'on')
  vars:
    ansible_become: yes
    ansible_become_method: runas
    ansible_become_user: "{{domain_username}}"
    ansible_become_password: "{{domain_password}}"
  notify: restart-adcs
