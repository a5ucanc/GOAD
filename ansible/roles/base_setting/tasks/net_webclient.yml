- name: "Check accepted values for net.webclient"
  ansible.builtin.assert:
    that: "(setting_value | string) in ['absent', 'present']"
    fail_msg: "Invalid value '{{ setting_value }}' for net.webclient, accepted: ['absent', 'present']"
    quiet: true

- name: "Set WebDAV client feature"
  ansible.windows.win_feature:
    name: WebDAV-Redirector
    state: "{{ setting_value | string }}"
  register: webclient_feature

- name: "Reboot to apply the WebDAV client feature"
  ansible.windows.win_reboot:
    reboot_timeout: 600
    post_reboot_delay: 30
  when: webclient_feature.reboot_required

- name: "Start the WebClient service"
  ansible.windows.win_service:
    name: WebClient
    start_mode: auto
    state: started
  when: setting_value | string == 'present'
