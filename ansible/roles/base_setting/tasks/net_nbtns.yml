- name: "Check accepted values for net.nbtns"
  ansible.builtin.assert:
    that: "(setting_value | string) in ['disabled', 'enabled']"
    fail_msg: "Invalid value '{{ setting_value }}' for net.nbtns, accepted: ['disabled', 'enabled']"
    quiet: true

- name: "Find NetBT interfaces"
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\Interfaces' |
        Where-Object { $_.PSChildName -like 'Tcpip_*' } |
        ForEach-Object { $_.PSChildName }
  register: nbt_interfaces
  changed_when: false

- name: "Set NetBIOS over TCP/IP on every interface"
  ansible.windows.win_regedit:
    path: "HKLM:\\SYSTEM\\CurrentControlSet\\Services\\NetBT\\Parameters\\Interfaces\\{{ nbt_iface }}"
    name: NetbiosOptions
    data: "{{ 2 if setting_value | string == 'disabled' else 0 }}"
    type: dword
    state: present
  loop: "{{ nbt_interfaces.output }}"
  loop_control:
    loop_var: nbt_iface

- name: "Apply NetBIOS setting live on IP-enabled adapters"
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $Ansible.Changed = $false
      $want = [uint32]$env:NBT_OPT
      Get-CimInstance Win32_NetworkAdapterConfiguration -Filter 'IPEnabled=TRUE' | ForEach-Object {
        if ($_.TcpipNetbiosOptions -ne $want) {
          $r = Invoke-CimMethod -InputObject $_ -MethodName SetTcpipNetbios -Arguments @{ TcpipNetbiosOptions = $want }
          if ($r.ReturnValue -ne 0) { throw "SetTcpipNetbios failed: $($r.ReturnValue)" }
          $Ansible.Changed = $true
        }
      }
  environment:
    NBT_OPT: "{{ 2 if setting_value | string == 'disabled' else 0 }}"
