- name: "Check accepted values for winrm.credssp"
  ansible.builtin.assert:
    that: "(setting_value | string) in ['disabled', 'server', 'client']"
    fail_msg: "Invalid value '{{ setting_value }}' for winrm.credssp, accepted: ['disabled', 'server', 'client']"
    quiet: true

- name: "Set WinRM CredSSP roles"
  ansible.windows.win_powershell:
    script: |
      param([string]$Wanted)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $server = (Get-Item WSMan:\localhost\Service\Auth\CredSSP).Value -eq 'true'
      $client = (Get-Item WSMan:\localhost\Client\Auth\CredSSP).Value -eq 'true'
      if ($Wanted -eq 'server') { if (-not $server) { Enable-WSManCredSSP -Role Server -Force | Out-Null; $Ansible.Changed = $true } }
      elseif ($server) { Disable-WSManCredSSP -Role Server; $Ansible.Changed = $true }
      if ($Wanted -eq 'client') { if (-not $client) { Enable-WSManCredSSP -Role Client -DelegateComputer '*' -Force | Out-Null; $Ansible.Changed = $true } }
      elseif ($client) { Disable-WSManCredSSP -Role Client; $Ansible.Changed = $true }
    parameters:
      Wanted: "{{ setting_value | string }}"
