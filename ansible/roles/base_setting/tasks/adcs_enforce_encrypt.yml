- name: "Check accepted values for adcs.enforce_encrypt"
  ansible.builtin.assert:
    that: "(setting_value | string) in ['on', 'off']"
    fail_msg: "Invalid value '{{ setting_value }}' for adcs.enforce_encrypt, accepted: ['on', 'off']"
    quiet: true

- name: "Read current InterfaceFlags"
  ansible.windows.win_command: certutil -getreg CA\InterfaceFlags
  register: ifflags_current
  changed_when: false
  failed_when: false
  vars:
    ansible_become: yes
    ansible_become_method: runas
    ansible_become_user: "{{domain_username}}"
    ansible_become_password: "{{domain_password}}"

- name: "Set IF_ENFORCEENCRYPTICERTREQUEST"
  ansible.windows.win_command: "certutil -setreg CA\\InterfaceFlags {{ '+' if setting_value | string == 'on' else '-' }}IF_ENFORCEENCRYPTICERTREQUEST"
  when: >-
    ('IF_ENFORCEENCRYPTICERTREQUEST' in ifflags_current.stdout) != (setting_value | string == 'on')
  vars:
    ansible_become: yes
    ansible_become_method: runas
    ansible_become_user: "{{domain_username}}"
    ansible_become_password: "{{domain_password}}"
  notify: restart-adcs
