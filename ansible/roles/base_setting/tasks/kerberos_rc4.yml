- name: "Check accepted values for kerberos.rc4"
  ansible.builtin.assert:
    that: "(setting_value | string) in ['disabled', 'enabled']"
    fail_msg: "Invalid value '{{ setting_value }}' for kerberos.rc4, accepted: ['disabled', 'enabled']"
    quiet: true

- name: "Set Kerberos supported encryption types"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters
    name: SupportedEncryptionTypes
    data: "{{ 24 if setting_value | string == 'disabled' else 28 }}"
    type: dword
    state: present

# Trust objects have no msDS-SupportedEncryptionTypes by default, so the KDC assumes RC4 for
# inter-realm referrals. With RC4 disabled the referral would fail: declare the AES types on
# every trustedDomain object of the DC's domain. hardening runs on every DC, so both sides of a
# trust are set. AD refuses LDAP writes of this attribute on trustedDomain objects ("Illegal
# modify operation"), so the value is read over LDAP and written through LSA with ksetup.
- name: "Set Kerberos encryption types on trust objects"
  ansible.windows.win_powershell:
    script: |
      param([int]$Wanted)
      $Ansible.Changed = $false
      if ((Get-CimInstance Win32_ComputerSystem).DomainRole -lt 4) { return }
      Import-Module ActiveDirectory
      $names = @('AES128-CTS-HMAC-SHA1-96', 'AES256-CTS-HMAC-SHA1-96')
      if ($Wanted -band 4) { $names = @('RC4-HMAC-MD5') + $names }
      $base = 'CN=System,' + (Get-ADDomain).DistinguishedName
      $trusts = Get-ADObject -SearchBase $base -SearchScope OneLevel -LDAPFilter '(objectClass=trustedDomain)' -Properties 'msDS-SupportedEncryptionTypes', 'trustPartner'
      foreach ($trust in $trusts) {
        if ($trust.'msDS-SupportedEncryptionTypes' -ne $Wanted) {
          $out = & ksetup /setenctypeattr $trust.trustPartner @names 2>&1
          if ($LASTEXITCODE -ne 0) { throw "ksetup /setenctypeattr $($trust.trustPartner) failed: $out" }
          $Ansible.Changed = $true
        }
      }
    parameters:
      Wanted: "{{ 24 if setting_value | string == 'disabled' else 28 }}"
    error_action: stop
  vars:
    ansible_become: yes
    ansible_become_method: runas
    ansible_become_user: "{{domain_username}}"
    ansible_become_password: "{{domain_password}}"
