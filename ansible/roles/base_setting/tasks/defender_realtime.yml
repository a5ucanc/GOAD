- name: "Check accepted values for defender.realtime"
  ansible.builtin.assert:
    that: "(setting_value | string) in ['on', 'off']"
    fail_msg: "Invalid value '{{ setting_value }}' for defender.realtime, accepted: ['on', 'off']"
    quiet: true

- name: "Set Defender realtime protection"
  ansible.builtin.include_role:
    name: "{{ role_path }}/../settings/windows_defender"
  vars:
    windows_defender_status: "{{ setting_value | string }}"

- name: "Enable Defender realtime monitoring"
  ansible.windows.win_powershell:
    script: |
      Set-MpPreference -DisableRealtimeMonitoring $false
  when: setting_value | string == 'on'
