- name: "Check accepted values for dc.strong_cert_binding"
  ansible.builtin.assert:
    that: "(setting_value | string) in ['0', '1', '2']"
    fail_msg: "Invalid value '{{ setting_value }}' for dc.strong_cert_binding, accepted: ['0', '1', '2']"
    quiet: true

- name: "Set StrongCertificateBindingEnforcement"
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\Kdc
    name: StrongCertificateBindingEnforcement
    data: "{{ setting_value | int }}"
    type: dword
    state: present
