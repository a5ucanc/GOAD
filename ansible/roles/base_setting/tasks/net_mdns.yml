- name: "Check accepted values for net.mdns"
  ansible.builtin.assert:
    that: "(setting_value | string) in ['disabled', 'enabled']"
    fail_msg: "Invalid value '{{ setting_value }}' for net.mdns, accepted: ['disabled', 'enabled']"
    quiet: true

- name: "Set mDNS"
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\Dnscache\Parameters
    name: EnableMDNS
    data: "{{ 0 if setting_value | string == 'disabled' else 1 }}"
    type: dword
    state: present
  notify: reboot-base-setting
