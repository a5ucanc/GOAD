- name: "Check accepted values for net.llmnr"
  ansible.builtin.assert:
    that: "(setting_value | string) in ['disabled', 'enabled']"
    fail_msg: "Invalid value '{{ setting_value }}' for net.llmnr, accepted: ['disabled', 'enabled']"
    quiet: true

- name: "Set LLMNR policy"
  ansible.windows.win_regedit:
    path: HKLM:\Software\Policies\Microsoft\Windows NT\DNSClient
    name: EnableMulticast
    data: "{{ 0 if setting_value | string == 'disabled' else 1 }}"
    type: dword
    state: present
