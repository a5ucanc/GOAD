# Members start in a workgroup: the inventory user <NETBIOS>\Administrator fails until the
# join role runs. Fall back to the local Administrator for the rest of the run when it does.
- name: Probe the domain Administrator login
  ansible.windows.win_ping:
  register: domain_login
  ignore_unreachable: true

- name: Use the local Administrator until the host is joined
  ansible.builtin.set_fact:
    ansible_user: "{{ local_user }}"
  when: domain_login.unreachable | default(false)

# Windows LAPS replaces the local Administrator password of a joined laps host, so the fallback
# login needs the current password from the domain's DC. Without one (no LAPS run yet, no schema,
# DC down) the lab password stays.
# The member may have booted before its DC: wait for the DC first. A connection failure skips
# retries/until (ansible-core reports it as unreachable without retrying), but
# wait_for_connection polls the DC until it answers or the timeout ends.
- name: Wait for the DC before reading the Windows LAPS password
  ansible.builtin.wait_for_connection:
    timeout: 600
  delegate_to: "{{ goad_domains[domain].dc }}"
  register: laps_dc
  ignore_unreachable: true
  ignore_errors: true
  when: (domain_login.unreachable | default(false)) and (laps | default(false))

# Unreachable or failed (AD not ready yet, no password): retried, then ignored.
- name: Read the Windows LAPS password of the host from its DC
  ansible.windows.win_powershell:
    parameters:
      Name: "{{ hostname }}"
    script: |
      param([string]$Name)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $password = [string](Get-LapsADPassword -Identity $Name -AsPlainText).Password
      if (-not $password) { throw "no Windows LAPS password in Active Directory for $Name" }
      $Ansible.Result = $password
  delegate_to: "{{ goad_domains[domain].dc }}"
  register: laps_login
  retries: 10
  delay: 6
  until: laps_login is succeeded
  ignore_unreachable: true
  ignore_errors: true
  changed_when: false
  when: laps_dc is not skipped and laps_dc is succeeded and not (laps_dc.unreachable | default(false))

- name: Use the Windows LAPS password for the local Administrator
  ansible.builtin.set_fact:
    ansible_password: "{{ laps_login.result }}"
  when: >-
    laps_login is not skipped and laps_login is succeeded and not (laps_login.unreachable | default(false))
    and laps_login.result | default('') is string and laps_login.result | default('') | length > 0

# A joined member that boots before its DC can keep a failed secure channel for a while, so the
# domain login fails although the host is joined. Reset the channel and go back to the domain login.
- name: Repair the secure channel of a joined host
  ansible.windows.win_powershell:
    parameters:
      User: "{{ netbios }}\\Administrator"
      Password: "{{ lab_password }}"
    script: |
      param([string]$User, [string]$Password)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $system = Get-CimInstance Win32_ComputerSystem
      $Ansible.Result = $system.PartOfDomain
      if ($system.PartOfDomain -and -not (Test-ComputerSecureChannel)) {
          # nltest reports a failure on stderr, which Stop would turn into a terminating error.
          cmd.exe /c "nltest /sc_reset:$($system.Domain) >nul 2>&1"
          if (-not (Test-ComputerSecureChannel)) {
              # A machine password out of step with AD needs a reset with domain credentials.
              $secure = ConvertTo-SecureString $Password -AsPlainText -Force
              $cred = New-Object System.Management.Automation.PSCredential($User, $secure)
              Test-ComputerSecureChannel -Repair -Credential $cred | Out-Null
          }
          if (-not (Test-ComputerSecureChannel)) { throw "no secure channel to $($system.Domain)" }
          $Ansible.Changed = $true
      }
  register: secure_channel
  retries: 30
  delay: 10
  until: secure_channel is succeeded
  when: domain_login.unreachable | default(false)

- name: Use the domain Administrator on a joined host
  ansible.builtin.set_fact:
    ansible_user: "{{ netbios }}\\Administrator"
    ansible_password: "{{ lab_password }}"
  when: secure_channel.result | default(false)
