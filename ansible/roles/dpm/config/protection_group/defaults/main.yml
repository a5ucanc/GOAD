# DPM protection group settings
dpm_pg_name: "GOAD-Finance-Backup"
# Data sources on the protected server to back up, first match wins (Get-DPMDatasource -Inquire names).
# The Finance share holds the lab's sensitive data; the C:\ volume is the fallback.
dpm_protected_datasources:
  - "Finance"
  - "C:\\Shares\\Finance"
  - "C:\\"
dpm_retention_days: 5
# one of 15, 30, 60, 120, 240, 360, 720, 1440 (Set-DPMPolicyObjective validation)
dpm_sync_frequency_minutes: 360

# Modern Backup Storage volume, on the data disk the vagrant provider adds to the DPM VM
dpm_storage_min_size_gb: 20
dpm_storage_drive_letter: "S"
dpm_storage_friendly_name: "GOAD-MBS"
