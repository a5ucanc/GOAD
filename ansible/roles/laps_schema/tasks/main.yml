# Windows LAPS stores the password in schema attributes the forest does not have by default.
# Runs on forest-root DCs whose forest has a laps host (laps_schema in the inventory).
# AD can reject schema operations for a while after the DCs are restored from a snapshot: the
# schema_master role syncs this DC first, only when the attributes are missing.
- name: Look for the Windows LAPS schema attributes
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $schema = (Get-ADRootDSE).schemaNamingContext
      $Ansible.Result = @{ extended = [bool](Get-ADObject -SearchBase $schema -LDAPFilter '(lDAPDisplayName=msLAPS-Password)') }
  register: laps_schema_state
  retries: 10
  delay: 30
  until: laps_schema_state is not failed

- name: Sync the schema master
  ansible.builtin.include_role:
    name: schema_master
  when: not laps_schema_state.result.extended

- name: Extend the schema for Windows LAPS
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $schema = (Get-ADRootDSE).schemaNamingContext
      if (-not (Get-ADObject -SearchBase $schema -LDAPFilter '(lDAPDisplayName=msLAPS-Password)')) {
          Update-LapsADSchema -Confirm:$false
          $Ansible.Changed = $true
      }
  become: true
  become_method: ansible.builtin.runas
  become_user: "{{ netbios }}\\Administrator"
  vars:
    ansible_become_password: "{{ lab_password }}"
  when: not laps_schema_state.result.extended
  register: laps_schema_extend
  retries: 10
  delay: 30
  until: laps_schema_extend is not failed
