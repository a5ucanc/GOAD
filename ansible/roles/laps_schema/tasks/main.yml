# Windows LAPS stores the password in schema attributes the forest does not have by default.
# Runs on forest-root DCs whose forest has a laps host (laps_schema in the inventory).
# AD can reject schema operations for a while after the DCs are restored from a snapshot.
# repadmin makes RPC calls to the DCs, which need the full logon of become (WinRM's network logon
# cannot hop).
- name: Extend the schema for Windows LAPS
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $schema = (Get-ADRootDSE).schemaNamingContext
      if (-not (Get-ADObject -SearchBase $schema -LDAPFilter '(lDAPDisplayName=msLAPS-Password)')) {
          # After a snapshot restore the schema master refuses schema changes (event 2092) until it has
          # replicated with a partner, and AD's own retry can take an hour. Pull the partitions inbound
          # so the schema master validates its FSMO role; the exit code is ignored (native exit codes
          # do not throw), a failed sync only shows up as the update failing.
          repadmin /syncall $env:COMPUTERNAME /Ade | Out-Null
          $global:LASTEXITCODE = 0
          Update-LapsADSchema -Confirm:$false
          $Ansible.Changed = $true
      }
  become: true
  become_method: ansible.builtin.runas
  become_user: "{{ netbios }}\\Administrator"
  vars:
    ansible_become_password: "{{ lab_password }}"
  register: laps_schema_extend
  retries: 10
  delay: 30
  until: laps_schema_extend is not failed
