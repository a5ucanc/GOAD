# SQL Server 2019 Express, as on main. The SSEI bootstrapper downloads its media during setup.
mssql_instance: SQLEXPRESS
mssql_service: MSSQL$SQLEXPRESS
# MSSQL15 = SQL Server 2019
mssql_instance_key: HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\MSSQL15.SQLEXPRESS\MSSQLServer
# SQL2019-SSEI-Expr.exe
mssql_download_url: https://go.microsoft.com/fwlink/?linkid=866658
# aka.ms/ssmsfullsetup now serves SSMS 21/22 (Visual Studio installer based), whose bootstrapper hangs
# forever when run from a WinRM session and installs to a different path. Pin the classic SSMS 18.12.1.
mssql_ssms_url: https://go.microsoft.com/fwlink/?linkid=2199013&clcid=0x409
mssql_ssms_dir: C:\Program Files (x86)\Microsoft SQL Server Management Studio 18
mssql_setup_dir: C:\setup\mssql
# The service account: the domain user sql_svc the mssql extension adds to the host's domain.
mssql_svc_account: "{{ netbios }}\\sql_svc"
mssql_svc_password: "{{ goad_domains[domain].users.sql_svc.password | default(lab_password) }}"
mssql_sa_password: "{{ lab_password }}"
