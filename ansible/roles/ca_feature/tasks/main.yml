# Starts the ADCS-Cert-Authority install and returns at once; the adcs role (settings play) waits for
# it. Not in the template: dcpromo refuses to run while it is installed. On a just-promoted DC the
# install takes up to 9 minutes (3 minutes idle), so it runs through the join and content play.
# It runs as a SYSTEM scheduled task: Ansible async over PSRP fails when the session profile unloads
# ("Illegal operation attempted on a registry key that has been marked for deletion").
# The task writes %ProgramData%\goad\ca-feature.json when it ends; the adcs role reads and deletes it.
# On a member it starts after the domain join.
- name: Start the certification authority role install
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $name = 'goad-ca-feature'
      # An install is under way, or finished with a result the adcs role has not read yet.
      $task = Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue
      $dir = Join-Path $env:ProgramData 'goad'
      $result = Join-Path $dir 'ca-feature.json'
      if ($task -and ($task.State -eq 'Running' -or (Test-Path $result))) { return }
      # Installed already: CertSvc exists only with the role.
      if (Get-Service CertSvc -ErrorAction SilentlyContinue) { return }
      # Registered, not running, no result: the VM restarted during the install. Start it again.
      if ($task) { Unregister-ScheduledTask -TaskName $name -Confirm:$false }
      New-Item -ItemType Directory -Force -Path $dir | Out-Null
      Remove-Item -Force -ErrorAction SilentlyContinue -Path $result
      $install = @"
      try {
          `$r = Install-WindowsFeature ADCS-Cert-Authority -IncludeManagementTools -ErrorAction Stop
          `$out = @{ Success = [bool]`$r.Success; RestartNeeded = [string]`$r.RestartNeeded; Error = '' }
      } catch {
          `$out = @{ Success = `$false; RestartNeeded = 'No'; Error = [string]`$_ }
      }
      `$out | ConvertTo-Json | Set-Content -Encoding ascii -Path '$result.tmp'
      Move-Item -Force -Path '$result.tmp' -Destination '$result'
      "@
      $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($install))
      $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument "-NoProfile -NonInteractive -EncodedCommand $encoded"
      Register-ScheduledTask -TaskName $name -Action $action -User 'SYSTEM' -RunLevel Highest -Force | Out-Null
      Start-ScheduledTask -TaskName $name
      $Ansible.Changed = $true
