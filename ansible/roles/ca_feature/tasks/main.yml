# Runs in the child play, beside the child promotion, so the slow feature install is off the critical path.
# Not in the template: dcpromo refuses to run while it is installed. On a member it may be installed before
# the domain join; the join accepts it.
# win_feature takes minutes even when the feature is already there: the CertSvc service exists only
# with the role, so it decides whether the install runs.
- name: Check whether the certification authority role is installed
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $Ansible.Result = [bool](Get-Service CertSvc -ErrorAction SilentlyContinue)
  register: ca_installed
  changed_when: false

- name: Certification authority role
  ansible.windows.win_feature:
    name: ADCS-Cert-Authority
    state: present
    include_management_tools: true
  register: ca_feature
  when: not ca_installed.result

- name: Reboot after installing the certification authority role
  ansible.windows.win_reboot:
  when: ca_feature is changed and ca_feature.reboot_required
