# The ADCS-Cert-Authority feature install was started by the ca_feature role (join and content play) as the
# SYSTEM scheduled task goad-ca-feature, which writes %ProgramData%\goad\ca-feature.json when it ends.
# Polling here is a readiness check, not a fixed wait. It retries only while the install runs (and on
# transport failures); a failed, stopped or missing install ends the wait at once. A failed or stopped
# install leaves no task behind, so the next run of ca_feature starts it again.
- name: Wait for the certification authority role install
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $name = 'goad-ca-feature'
      $result = Join-Path $env:ProgramData 'goad\ca-feature.json'
      $task = Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue
      if (Test-Path $result) {
          $r = Get-Content -Raw -Path $result | ConvertFrom-Json
          Unregister-ScheduledTask -TaskName $name -Confirm:$false -ErrorAction SilentlyContinue
          Remove-Item -Force -Path $result
          if ($r.Success) {
              $Ansible.Result = @{ state = 'done'; restart = $r.RestartNeeded -ne 'No'; error = '' }
          } else {
              $Ansible.Result = @{ state = 'failed'; restart = $false; error = "AD CS role install failed: $($r.Error)" }
          }
      } elseif ($task -and $task.State -eq 'Running') {
          $Ansible.Result = @{ state = 'running'; restart = $false; error = '' }
      } elseif ($task) {
          # Registered, not running, no result: the VM restarted during the install.
          Unregister-ScheduledTask -TaskName $name -Confirm:$false
          $Ansible.Result = @{ state = 'failed'; restart = $false
              error = 'the AD CS role install stopped before it finished: run goad lab provision --tags adcs' }
      } elseif (Get-Service CertSvc -ErrorAction SilentlyContinue) {
          $Ansible.Result = @{ state = 'done'; restart = $false; error = '' }
      } else {
          $Ansible.Result = @{ state = 'missing'; restart = $false
              error = 'the AD CS role is not installed and no install is running: run goad lab provision --tags adcs' }
      }
  register: ca_wait
  until: ca_wait is succeeded and ca_wait.result.state != 'running'
  retries: 120
  delay: 10
  changed_when: false

- name: Report a failed certification authority role install
  ansible.builtin.fail:
    msg: "{{ ca_wait.result.error }}"
  when: ca_wait.result.state in ['failed', 'missing']

- name: Reboot after installing the certification authority role
  ansible.windows.win_reboot:
  when: ca_wait.result.restart

# The explicit credential avoids the PSRP double hop on member servers.
- name: Enterprise root certification authority
  ansible.windows.win_powershell:
    parameters:
      Name: "{{ netbios }}-CA"
      User: "{{ netbios }}\\Administrator"
      Password: "{{ lab_password }}"
    script: |
      param([string]$Name, [string]$User, [string]$Password)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      if (-not (Test-Path "HKLM:\SYSTEM\CurrentControlSet\Services\CertSvc\Configuration\$Name")) {
          $secure = ConvertTo-SecureString $Password -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential($User, $secure)
          Install-AdcsCertificationAuthority -CAType EnterpriseRootCA -CACommonName $Name `
              -CryptoProviderName 'RSA#Microsoft Software Key Storage Provider' -KeyLength 2048 `
              -HashAlgorithmName SHA256 -ValidityPeriod Years -ValidityPeriodUnits 5 `
              -Credential $cred -Force | Out-Null
          $Ansible.Changed = $true
      }

# After the CA exists: its install creates the built-in templates and the Enrollment Services object.
- name: Certificate templates, issuance policies and CA ACLs
  ansible.builtin.include_tasks: templates.yml
