# LSA protection takes effect at the next boot.
- name: "Set LSA protection (RunAsPPL)"
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: RunAsPPL
    data: "{{ 1 if setting_value == 'on' else 0 }}"
    type: dword
    state: present
  notify: reboot-settings
