# One round trip: server and workstation values and, on a DC, the Default Domain Controllers Policy.
- name: "Set SMB signing requirement"
  ansible.windows.win_powershell:
    script: |
      {{ lookup('ansible.builtin.file', 'dc_gpo.ps1') | indent(6) }}
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $value = {{ 1 if setting_value == 'required' else 0 }}
      foreach ($service in 'LanmanServer', 'LanmanWorkstation') {
          $path = "HKLM:\SYSTEM\CurrentControlSet\Services\$service\Parameters"
          if ((Get-ItemProperty -Path $path -ErrorAction SilentlyContinue).RequireSecuritySignature -ne $value) {
              if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
              New-ItemProperty -Path $path -Name RequireSecuritySignature -Value $value -PropertyType DWord -Force | Out-Null
              $Ansible.Changed = $true
          }
      }
      if ((Get-CimInstance Win32_ComputerSystem).DomainRole -ge 4) {
          $key = 'MACHINE\System\CurrentControlSet\Services\LanManServer\Parameters\RequireSecuritySignature'
          if (Set-DcGpoValue -RegKey $key -Value "$value") { $Ansible.Changed = $true }
      }
    error_action: stop
