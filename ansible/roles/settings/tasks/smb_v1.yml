# One round trip on the usual path. A previous change may still wait for a reboot ("Pending"): the set
# task then changes nothing and reports pending, the host reboots, and the set task runs again.
# Disabled and DisabledWithPayloadRemoved are both off.
- name: "Set SMB1Protocol feature"
  ansible.windows.win_powershell:
    script: &smb_v1_script |
      param([string]$Wanted)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $state = (Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol).State.ToString()
      $Ansible.Result = @{ pending = $state -like '*Pending*'; restart = $false }
      if ($Ansible.Result.pending) { return }
      if ($Wanted -eq 'enabled' -and $state -notlike 'Enable*') {
        $Ansible.Result.restart = [bool](Enable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -All -NoRestart).RestartNeeded
        $Ansible.Changed = $true
      } elseif ($Wanted -eq 'disabled' -and $state -notlike 'Disable*') {
        $Ansible.Result.restart = [bool](Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart).RestartNeeded
        $Ansible.Changed = $true
      }
    parameters:
      Wanted: "{{ setting_value }}"
  register: smb_v1_set

- name: "Reboot for SMB1Protocol"
  ansible.windows.win_reboot:
    reboot_timeout: 600
  when: smb_v1_set.result.pending or smb_v1_set.result.restart

- name: "Set SMB1Protocol feature after the pending change"
  ansible.windows.win_powershell:
    script: *smb_v1_script
    parameters:
      Wanted: "{{ setting_value }}"
  register: smb_v1_again
  failed_when: smb_v1_again.result.pending or smb_v1_again.result.restart
  when: smb_v1_set.result.pending
