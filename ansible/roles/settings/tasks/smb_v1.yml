# A previous change may still wait for a reboot: finish it before changing the feature again.
- name: "Read SMB1Protocol state"
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      (Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol).State.ToString()
  register: smb_v1_state
  changed_when: false

- name: "Reboot to finish a pending SMB1Protocol change"
  ansible.windows.win_reboot:
    reboot_timeout: 600
  when: smb_v1_state.output[0] is search('Pending')

- name: "Set SMB1Protocol feature"
  ansible.windows.win_powershell:
    script: |
      param([string]$Wanted)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $state = (Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol).State.ToString()
      # Disabled and DisabledWithPayloadRemoved are both off. Pending states were rebooted above.
      $restart = $false
      if ($Wanted -eq 'enabled' -and $state -notlike 'Enable*') {
        $restart = (Enable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -All -NoRestart).RestartNeeded
        $Ansible.Changed = $true
      } elseif ($Wanted -eq 'disabled' -and $state -notlike 'Disable*') {
        $restart = (Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart).RestartNeeded
        $Ansible.Changed = $true
      }
      [bool]$restart
    parameters:
      Wanted: "{{ setting_value }}"
  register: smb_v1_set

- name: "Reboot to apply SMB1Protocol"
  ansible.windows.win_reboot:
    reboot_timeout: 600
  when: smb_v1_set.output[0] | bool
