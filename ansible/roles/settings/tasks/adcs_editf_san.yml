- name: "Read current EditFlags"
  ansible.windows.win_command: certutil -getreg policy\EditFlags
  register: editf_current
  changed_when: false
  failed_when: false

- name: "Set EDITF_ATTRIBUTESUBJECTALTNAME2"
  ansible.windows.win_command: "certutil -setreg policy\\EditFlags {{ '+' if setting_value == 'on' else '-' }}EDITF_ATTRIBUTESUBJECTALTNAME2"
  when: >-
    ('EDITF_ATTRIBUTESUBJECTALTNAME2' in editf_current.stdout) != (setting_value == 'on')
  notify: restart-adcs

# flush_handlers runs every handler this host has pending, not only restart-adcs: a reboot-settings
# notified by a setting earlier in goad_settings (lsa.ppl, for one) reboots a CA DC here, mid-play,
# and settings after this one run on the rebooted host. Which reboot runs here depends on the order
# of goad_settings; settings after it still notify reboot-settings for the end of the play.
- name: "Restart certsvc now"
  ansible.builtin.meta: flush_handlers
