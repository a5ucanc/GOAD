# ASR rule "Block process creations originating from PSExec and WMI commands" (main's ws01 asr list).
- name: "Set ASR rule for PSExec and WMI process creation"
  ansible.builtin.include_tasks: _asr_rule.yml
  vars:
    asr_rule_id: d1e49aac-8f56-4280-b9ba-993a6d77406c
    asr_rule_action: "{{ 'Enabled' if setting_value == 'block' else 'Disabled' }}"
