# One round trip: the local value and, on a DC, the Default Domain Controllers Policy.
- name: "Set LDAP server signing"
  ansible.windows.win_powershell:
    script: |
      {{ lookup('ansible.builtin.file', 'dc_gpo.ps1') | indent(6) }}
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $value = {{ 2 if setting_value == 'required' else 1 }}
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\NTDS\Parameters'
      if ((Get-ItemProperty -Path $path -ErrorAction SilentlyContinue).LDAPServerIntegrity -ne $value) {
          if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
          New-ItemProperty -Path $path -Name LDAPServerIntegrity -Value $value -PropertyType DWord -Force | Out-Null
          $Ansible.Changed = $true
      }
      if ((Get-CimInstance Win32_ComputerSystem).DomainRole -ge 4) {
          $key = 'MACHINE\System\CurrentControlSet\Services\NTDS\Parameters\LDAPServerIntegrity'
          if (Set-DcGpoValue -RegKey $key -Value "$value") { $Ansible.Changed = $true }
      }
    error_action: stop
