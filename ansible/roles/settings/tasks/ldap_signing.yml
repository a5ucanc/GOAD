- name: "Set LDAP server signing"
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\NTDS\Parameters
    name: LDAPServerIntegrity
    data: "{{ 2 if setting_value == 'required' else 1 }}"
    type: dword
    state: present

- name: "Set LDAP server signing in Default Domain Controllers Policy"
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', 'set_dc_gpo_value.ps1') }}"
    parameters:
      RegKey: 'MACHINE\System\CurrentControlSet\Services\NTDS\Parameters\LDAPServerIntegrity'
      Value: "{{ 2 if setting_value == 'required' else 1 }}"
    error_action: stop
