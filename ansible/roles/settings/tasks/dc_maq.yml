# ms-DS-MachineAccountQuota is a domain attribute: any DC of the domain can set it.
# 10 is the Windows default and lets any domain user create computer accounts (RBCD, noPAC, ...).
- name: "Set ms-DS-MachineAccountQuota"
  ansible.windows.win_powershell:
    script: |
      param([int]$Wanted)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      Import-Module ActiveDirectory
      $domain = Get-ADDomain
      $current = (Get-ADObject -Identity $domain.DistinguishedName -Properties 'ms-DS-MachineAccountQuota').'ms-DS-MachineAccountQuota'
      if ($current -ne $Wanted) {
        Set-ADDomain -Identity $domain -Replace @{ 'ms-DS-MachineAccountQuota' = $Wanted }
        $Ansible.Changed = $true
      }
    parameters:
      Wanted: "{{ setting_value | int }}"
    error_action: stop
