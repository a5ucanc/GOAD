# ASR rule "Block credential stealing from the Windows local security authority subsystem".
# Get-MpPreference reports actions as numbers: 0 Disabled, 1 Enabled (block), 2 Audit, 6 Warn.
- name: "Set ASR rule for LSASS credential theft"
  ansible.windows.win_powershell:
    script: |
      param([string]$Id, [string]$Action)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $wanted = @{ Disabled = 0; Enabled = 1 }[$Action]
      $pref = Get-MpPreference
      $ids = @($pref.AttackSurfaceReductionRules_Ids)
      $actions = @($pref.AttackSurfaceReductionRules_Actions)
      $current = $null
      for ($i = 0; $i -lt $ids.Count; $i++) {
        if ($ids[$i] -and $ids[$i] -eq $Id) { $current = [int]$actions[$i] }
      }
      if ($current -ne $wanted) {
        Add-MpPreference -AttackSurfaceReductionRules_Ids $Id -AttackSurfaceReductionRules_Actions $Action
        $Ansible.Changed = $true
      }
    parameters:
      Id: 9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2
      Action: "{{ 'Enabled' if setting_value == 'block' else 'Disabled' }}"
    error_action: stop
  # Defender's WMI provider answers 0x800106ba until WinDefend is up, e.g. right after a reboot.
  register: asr_lsass
  retries: 10
  delay: 15
  until: asr_lsass is not failed
