# Tier groups of every domain of the lab that a host of this tier must refuse. The built-in
# Administrator is never listed: it is the provisioning account. Nobody is denied network
# logon on a DC (LDAP, SYSVOL, GPO), and T0 keeps network logon on tier 1 (WinRM provisioning).
- name: "Compute tier deny lists"
  ansible.builtin.set_fact:
    tier_deny_interactive: >-
      {{ goad_domains.values() | map(attribute='netbios') | product(tier_matrix[setting_value].interactive) | map('join', tier_sep) | list }}
    tier_deny_network: >-
      {{ goad_domains.values() | map(attribute='netbios') | product(tier_matrix[setting_value].network) | map('join', tier_sep) | list }}
    tier_all_groups: >-
      {{ goad_domains.values() | map(attribute='netbios') | product(['T0-Admins', 'T1-ServerAdmins', 'T2-WorkstationAdmins']) | map('join', tier_sep) | list }}
  vars:
    # Ansible doubles a backslash written inside a Jinja string literal: keep it in a YAML value.
    tier_sep: "\\"
    tier_matrix:
      '0':
        interactive: [T1-ServerAdmins, T2-WorkstationAdmins]
        network: []
      '1':
        interactive: [T0-Admins, T2-WorkstationAdmins]
        network: [T2-WorkstationAdmins]
      '2':
        interactive: [T0-Admins, T1-ServerAdmins]
        network: [T0-Admins, T1-ServerAdmins]

- name: "Add tier groups to deny logon rights"
  ansible.windows.win_user_right:
    name: "{{ tier_right.name }}"
    users: "{{ tier_right.users }}"
    action: add
  register: tier_result
  # names of the other forest may not translate right after a reboot
  until: tier_result is succeeded
  retries: 5
  delay: 30
  loop: "{{ tier_rights }}"
  loop_control:
    loop_var: tier_right
  when: tier_right.users | length > 0
  vars:
    tier_rights:
      - { name: SeDenyInteractiveLogonRight, users: "{{ tier_deny_interactive }}" }
      - { name: SeDenyRemoteInteractiveLogonRight, users: "{{ tier_deny_interactive }}" }
      - { name: SeDenyBatchLogonRight, users: "{{ tier_deny_interactive }}" }
      - { name: SeDenyServiceLogonRight, users: "{{ tier_deny_interactive }}" }
      - { name: SeDenyNetworkLogonRight, users: "{{ tier_deny_network }}" }

# Remove the tier groups this tier does not deny, so a tier change converges. Other
# principals in these rights are left alone.
- name: "Remove other tier groups from deny logon rights"
  ansible.windows.win_user_right:
    name: "{{ tier_right.name }}"
    users: "{{ tier_all_groups | difference(tier_right.users) }}"
    action: remove
  register: tier_result
  # names of the other forest may not translate right after a reboot
  until: tier_result is succeeded
  retries: 5
  delay: 30
  loop: "{{ tier_rights }}"
  loop_control:
    loop_var: tier_right
  when: tier_all_groups | difference(tier_right.users) | length > 0
  vars:
    tier_rights:
      - { name: SeDenyInteractiveLogonRight, users: "{{ tier_deny_interactive }}" }
      - { name: SeDenyRemoteInteractiveLogonRight, users: "{{ tier_deny_interactive }}" }
      - { name: SeDenyBatchLogonRight, users: "{{ tier_deny_interactive }}" }
      - { name: SeDenyServiceLogonRight, users: "{{ tier_deny_interactive }}" }
      - { name: SeDenyNetworkLogonRight, users: "{{ tier_deny_network }}" }
