# One round trip: NetbiosOptions on every NetBT interface (applies at the next boot) and the live
# setting on IP-enabled adapters.
- name: "Set NetBIOS over TCP/IP"
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      param([uint32]$Wanted)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $root = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\Interfaces'
      Get-ChildItem $root | Where-Object { $_.PSChildName -like 'Tcpip_*' } | ForEach-Object {
        if ((Get-ItemProperty -Path $_.PSPath).NetbiosOptions -ne $Wanted) {
          New-ItemProperty -Path $_.PSPath -Name NetbiosOptions -Value $Wanted -PropertyType DWord -Force | Out-Null
          $Ansible.Changed = $true
        }
      }
      Get-CimInstance Win32_NetworkAdapterConfiguration -Filter 'IPEnabled=TRUE' | ForEach-Object {
        if ($_.TcpipNetbiosOptions -ne $Wanted) {
          $r = Invoke-CimMethod -InputObject $_ -MethodName SetTcpipNetbios -Arguments @{ TcpipNetbiosOptions = $Wanted }
          if ($r.ReturnValue -ne 0) { throw "SetTcpipNetbios failed: $($r.ReturnValue)" }
          $Ansible.Changed = $true
        }
      }
    parameters:
      Wanted: "{{ 2 if setting_value == 'disabled' else 0 }}"
