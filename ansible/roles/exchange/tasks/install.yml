# Exchange Server SE setup from the ISO: schema, AD (organization), then the Mailbox role, unattended.
- name: Look for the Exchange ISO
  ansible.windows.win_stat:
    path: "{{ exchange_iso }}"
    get_checksum: false
  register: exchange_iso_file

# About 6 GB, downloaded once
- name: Download the Exchange ISO
  ansible.windows.win_get_url:
    url: "{{ exchange_iso_url }}"
    dest: "{{ exchange_iso }}"
    force: false
    checksum: "{{ exchange_iso_sha256 }}"
    checksum_algorithm: sha256
  when: not exchange_iso_file.stat.exists

- name: Look for a pending reboot
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', 'pending_reboot.ps1') }}"
  register: exchange_pending

# Setup refuses to run while Windows waits for a reboot
- name: Reboot before setup
  ansible.windows.win_reboot:
    reboot_timeout: 1800
  when: exchange_pending.result.pending

- name: Mount the Exchange ISO
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', 'mount.ps1') }}"
    parameters:
      Path: "{{ exchange_iso }}"
  register: exchange_mount

# After a snapshot restore the schema master refuses schema changes until it has replicated with a
# partner (ldifde 0x21a2): sync the forest-root DC of this host's forest first. This file only runs
# while Exchange is not installed, so a finished install skips the sync.
- name: Sync the schema master
  ansible.builtin.include_role:
    name: schema_master

# Setup with the Administrator's network credentials (see main.yml). The three steps rerun safely, so
# the AD steps retry once the schema master or replication catches up.
- name: Prepare the schema
  ansible.windows.win_command: >-
    {{ exchange_mount.result }}Setup.exe /IAcceptExchangeServerLicenseTerms_DiagnosticDataOFF /PrepareSchema
    /DomainController:{{ exchange_dc }}
  args:
    chdir: "{{ exchange_setup_dir }}"
  become: true
  become_method: ansible.builtin.runas
  become_user: "{{ exchange_admin }}"
  become_flags: logon_type=new_credentials logon_flags=netcredentials_only
  vars:
    ansible_become_password: "{{ lab_password }}"
  register: exchange_prepare_schema
  retries: 3
  delay: 60
  until: exchange_prepare_schema.rc | default(1) == 0

- name: Prepare Active Directory
  ansible.windows.win_command: >-
    {{ exchange_mount.result }}Setup.exe /IAcceptExchangeServerLicenseTerms_DiagnosticDataOFF /PrepareAD
    /OrganizationName:{{ exchange_organization }} /DomainController:{{ exchange_dc }}
  args:
    chdir: "{{ exchange_setup_dir }}"
  become: true
  become_method: ansible.builtin.runas
  become_user: "{{ exchange_admin }}"
  become_flags: logon_type=new_credentials logon_flags=netcredentials_only
  vars:
    ansible_become_password: "{{ lab_password }}"
  register: exchange_prepare_ad
  retries: 3
  delay: 60
  until: exchange_prepare_ad.rc | default(1) == 0

# 30 to 60 minutes
- name: Install the Mailbox role
  ansible.windows.win_command: >-
    {{ exchange_mount.result }}Setup.exe /IAcceptExchangeServerLicenseTerms_DiagnosticDataOFF /Mode:Install
    /Roles:Mailbox /DomainController:{{ exchange_dc }}
  args:
    chdir: "{{ exchange_setup_dir }}"
  become: true
  become_method: ansible.builtin.runas
  become_user: "{{ exchange_admin }}"
  become_flags: logon_type=new_credentials logon_flags=netcredentials_only
  vars:
    ansible_become_password: "{{ lab_password }}"

- name: Reboot after Exchange setup
  ansible.windows.win_reboot:
    reboot_timeout: 1800

- name: Dismount the Exchange ISO
  ansible.windows.win_powershell:
    script: |
      param([string]$Path)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      if ((Get-DiskImage -ImagePath $Path).Attached) {
          Dismount-DiskImage -ImagePath $Path | Out-Null
          $Ansible.Changed = $true
      }
    parameters:
      Path: "{{ exchange_iso }}"

- name: Remove the Exchange ISO
  ansible.windows.win_file:
    path: "{{ exchange_iso }}"
    state: absent
