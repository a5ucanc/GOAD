# The connect role (play 1) has set ansible_user to the local Administrator on unjoined members.
- name: Join the domain
  microsoft.ad.membership:
    dns_domain_name: "{{ domain }}"
    domain_admin_user: "{{ netbios }}\\Administrator"
    domain_admin_password: "{{ lab_password }}"
    state: domain
    # Not reboot: true. microsoft.ad treats a connection failure while it sends shutdown.exe as a
    # started reboot; the join can drop the PSRP connection (network profile switch), and the task
    # then waited 600 s for a reboot that never ran. The next task opens a fresh connection first.
    reboot: false
  register: join_result

- name: Reboot after the domain join
  ansible.windows.win_reboot:
    reboot_timeout: 600
  when: join_result.reboot_required

# psrp opens a new connection for each task, so the next task already logs in as this user.
- name: Use the domain Administrator from now on
  ansible.builtin.set_fact:
    ansible_user: "{{ netbios }}\\Administrator"
