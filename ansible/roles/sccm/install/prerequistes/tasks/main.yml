# Prepare Active Directory for Configuration Manager site publishing
# https://learn.microsoft.com/en-us/intune/configmgr/core/plan-design/network/extend-the-active-directory-schema
# --------------------------------------------------------------

# Step 1 - Create the System Management container
- name: create the System Management Container
  ansible.windows.win_powershell:
    script: |
      $systemDN = "CN=System," + (Get-ADDomain).DistinguishedName
      $systemMgmtDN = "CN=System Management," + $systemDN
      $exists = Get-ADObject -LDAPFilter "(objectClass=container)" -SearchBase $systemDN -SearchScope OneLevel | Where-Object { $_.DistinguishedName -eq $systemMgmtDN }
      if ($null -eq $exists) {
        New-ADObject -Type container -Name "System Management" -Path $systemDN
        $Ansible.Changed = $true
      } else {
        $Ansible.Changed = $false
      }
    error_action: stop

# Step 2 - Grant the site server computer account Full Control on the System Management container (and children)
- name: grant the SCCM site server full control on the System Management Container
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param (
          [String]
          $SCCMServer
      )
      $systemMgmtDN = "CN=System Management,CN=System," + (Get-ADDomain).DistinguishedName
      $acl = Get-ACL -Path "AD:\$systemMgmtDN"
      $sccmIdentity = Get-ADComputer -Identity $SCCMServer
      $existing = $acl.Access | Where-Object { $_.IdentityReference -eq "$((Get-ADDomain).NetBIOSName)\$($sccmIdentity.SamAccountName)" -and $_.ActiveDirectoryRights -eq "GenericAll" -and $_.InheritanceType -eq "All" }
      if ($null -eq $existing) {
        $ace = New-Object System.DirectoryServices.ActiveDirectoryAccessRule(
          [System.Security.Principal.IdentityReference]$sccmIdentity.SID,
          [System.DirectoryServices.ActiveDirectoryRights]::GenericAll,
          [System.Security.AccessControl.AccessControlType]::Allow,
          [System.DirectoryServices.ActiveDirectorySecurityInheritance]::All)
        $acl.AddAccessRule($ace)
        Set-ACL -Path "AD:\$systemMgmtDN" -AclObject $acl
        $Ansible.Changed = $true
      } else {
        $Ansible.Changed = $false
      }
    error_action: stop
    parameters:
      SCCMServer: "{{sccm_server}}"

# Step 3 - Extend the Active Directory schema (extadsch.exe from the installation media)
# --------------------------------------------------------------

- name: create directory to store the downloaded prerequisite files
  ansible.windows.win_file:
    path: "{{ mecm_setup_path }}"
    state: directory

- name: check if the Active Directory schema is already extended for Configuration Manager
  ansible.windows.win_powershell:
    script: |
      $schemaDN = (Get-ADRootDSE).schemaNamingContext
      $attr = Get-ADObject -LDAPFilter "(cn=MS-SMS-Site-Code)" -SearchBase $schemaDN -ErrorAction SilentlyContinue
      $Ansible.Changed = $false
      $Ansible.Result = ($null -ne $attr)
  register: schema_extended

- name: check MECM installation media exists
  win_stat:
    path: "{{ mecm_setup_path }}\\{{ mecm_installer_file }}"
  register: mecm_installer_file_stat
  when: not schema_extended.result

- name: download MECM installation media (~1.2GB)
  ansible.windows.win_get_url:
    url: "{{ mecm_installer_url }}"
    dest: "{{ mecm_setup_path }}\\{{ mecm_installer_file }}"
  register: mecm_download
  until: mecm_download is success
  retries: 3
  delay: 30
  when: not schema_extended.result and not mecm_installer_file_stat.stat.exists

- name: Remove extracted media directory if exist
  ansible.windows.win_file:
    path: "{{ mecm_extract_path }}"
    state: absent
  when: not schema_extended.result

- name: extract MECM installation media
  win_shell: ".\\{{ mecm_installer_file }} -s"
  args:
    chdir: "{{ mecm_setup_path }}"
  when: not schema_extended.result

- name: check extracted media
  win_stat:
    path: "{{ mecm_extract_path }}\\SMSSETUP\\BIN\\X64\\extadsch.exe"
  register: extadsch_file
  when: not schema_extended.result

- name: fail if the installation media was not extracted
  fail:
    msg: "extadsch.exe not found in {{ mecm_extract_path }}\\SMSSETUP\\BIN\\X64, the MECM media extraction failed"
  when: not schema_extended.result and not extadsch_file.stat.exists

# Must be run as a member of the Schema Admins security group (the domain administrator is)
- name: launching the Active Directory schema extension
  win_shell: .\extadsch.exe
  args:
    chdir: "{{ mecm_extract_path }}\\SMSSETUP\\BIN\\X64"
  vars:
    ansible_become: yes
    ansible_become_method: runas
    ansible_become_user: "{{domain_username}}"
    ansible_become_password: "{{domain_password}}"
  when: not schema_extended.result

- name: verify the Active Directory schema extension result (C:\ExtADSch.log)
  ansible.windows.win_powershell:
    script: |
      $log = Get-Content -Path "C:\ExtADSch.log" -ErrorAction SilentlyContinue
      $Ansible.Changed = $false
      $Ansible.Result = ($null -ne ($log | Select-String -Pattern "Successfully extended the Active Directory schema"))
  register: extadsch_result
  failed_when: not extadsch_result.result
  when: not schema_extended.result
