#jinja2: newline_sequence:"\r\n"
; Unattended setup script for a standalone primary site
; keys reference : https://learn.microsoft.com/en-us/intune/configmgr/core/servers/deploy/install/command-line-script-file
[Identification]
Action=InstallPrimarySite

[Options]
ProductID=EVAL
SiteCode={{site_code}}
SiteName={{domain}} Site
SMSInstallDir={{ mecm_install_dir }}
SDKServer={{sccm_server}}.{{domain}}
RoleCommunicationProtocol=HTTPorHTTPS
ClientsUsePKICertificate=0
PrerequisiteComp=0
PrerequisitePath={{ mecm_prereq_path }}
ManagementPoint={{sccm_server}}.{{domain}}
ManagementPointProtocol=HTTP
DistributionPoint={{sccm_server}}.{{domain}}
DistributionPointProtocol=HTTP
DistributionPointInstallIIS=0
AdminConsole=1
JoinCEIP=0
MobileDeviceLanguage=0

[SQLConfigOptions]
SQLServerName={{sccm_mssql_server}}.{{domain}}
DatabaseName=CM_{{site_code}}
SQLServerPort=1433
SQLSSBPort=4022

[CloudConnectorOptions]
CloudConnector=1
CloudConnectorServer={{sccm_server}}.{{domain}}
UseProxy=0
ProxyName=
ProxyPort=

[SABranchOptions]
SAActive=1
CurrentBranch=1

[HierarchyExpansionOption]
