# Get-CMDevice lists the "All Systems" collection members : a freshly discovered computer is only visible
# after the collection is updated, so refresh it first
- name: Update the All Systems collection
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param (
          [String]
          $siteCode,

          [String]
          $sccmFQDN
      )
      Import-Module $env:SMS_ADMIN_UI_PATH.Replace("\bin\i386","\bin\configurationmanager.psd1") -force
      $sc = Get-PSDrive -PSProvider CMSITE
      if ($null -eq $sc) {
        New-PSDrive -Name $siteCode -PSProvider "CMSite" -Root $sccmFQDN -Description "primary site"
      }
      Set-Location ($siteCode +":")
      Get-CMCollection -Name "All Systems" | Invoke-CMCollectionUpdate
      Start-Sleep -Seconds 60
      $Ansible.Changed = $false
    parameters:
      siteCode: "{{site_code}}"
      sccmFQDN: "{{sccm_server}}.{{domain}}"
  vars:
    ansible_become: yes
    ansible_become_method: runas
    ansible_become_user: "{{domain_username}}"
    ansible_become_password: "{{domain_password}}"

- name: Install client
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param (
          [String]
          $siteCode,

          [String]
          $sccmFQDN,

          [String]
          $device
      )
      Import-Module $env:SMS_ADMIN_UI_PATH.Replace("\bin\i386","\bin\configurationmanager.psd1") -force
      $sc = Get-PSDrive -PSProvider CMSITE
      if ($null -eq $sc) {
        New-PSDrive -Name $siteCode -PSProvider "CMSite" -Root $sccmFQDN -Description "primary site"
      }
      Set-Location ($siteCode +":")

      $Ansible.Changed = $false
      $client_active = Get-CMDevice| Select-Object Name, ClientActiveStatus
      foreach($c in $client_active) {
          if (($c.name -eq $device) -and (-not $c.ClientActiveStatus)) {
            Install-CMClient -DeviceName $device -SiteCode $siteCode -AlwaysInstallClient $True -IncludeDomainController $true
            $Ansible.Changed = $true
          }
      }
    parameters:
      siteCode: "{{site_code}}"
      sccmFQDN: "{{sccm_server}}.{{domain}}"
      device: "{{item}}"
  vars:
    ansible_become: yes
    ansible_become_method: runas
    ansible_become_user: "{{domain_username}}"
    ansible_become_password: "{{domain_password}}"
  loop: "{{clients}}"
