# Covers this DC's own nat records and the glue records a child domain promotion writes into the
# parent zone (WINTERFELL.north -> nat address of the child DC). Runs from main.yml after promotion
# and again on the forest-root DC at the start of play `trust`, after the child domains exist.
- name: Remove A records of non-lab addresses
  ansible.windows.win_powershell:
    parameters:
      Zone: "{{ domain }}"
      # The inventory lab address of this DC, not the first IPv4 of the adapter: that one can be
      # an APIPA 169.254.x address, and then every lab record would look stale and be deleted.
      LabAddress: "{{ ansible_host }}"
    script: |
      param([string]$Zone, [string]$LabAddress)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $lab = Get-NetIPAddress -IPAddress $LabAddress -AddressFamily IPv4
      $mask = [uint32]0
      if ($lab.PrefixLength -gt 0) { $mask = [uint32]::MaxValue -shl (32 - $lab.PrefixLength) }
      function ConvertTo-UInt32([string]$Address) {
          $bytes = ([System.Net.IPAddress]::Parse($Address)).GetAddressBytes()
          [Array]::Reverse($bytes)
          [BitConverter]::ToUInt32($bytes, 0)
      }
      $network = (ConvertTo-UInt32 $lab.IPAddress) -band $mask
      $stale = @(Get-DnsServerResourceRecord -ZoneName $Zone -RRType A | Where-Object {
          ((ConvertTo-UInt32 $_.RecordData.IPv4Address.IPAddressToString) -band $mask) -ne $network })
      foreach ($record in $stale) {
          Remove-DnsServerResourceRecord -ZoneName $Zone -InputObject $record -Force
          $Ansible.Changed = $true
      }
      # drop answers cached from the removed records
      if ($Ansible.Changed) { Clear-DnsServerCache -Force }
