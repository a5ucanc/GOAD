# wazuh_version and wazuh_admin_password: ansible/group_vars/all/monitoring.yml (shared with role
# wazuh_agent). The admin password replaces the random one of wazuh-install.sh. It is set through hash.sh
# and securityadmin.sh: wazuh-passwords-tool.sh rejects passwords without one of .*+?-
# The installation assistant of the version's minor line. It installs the packages of its own
# wazuh_version: the role rewrites that line to the pinned version (the apt repository keeps old builds).
wazuh_install_script_url: "https://packages.wazuh.com/{{ wazuh_version.rsplit('.', 1)[0] }}/wazuh-install.sh"
wazuh_dir: /opt/wazuh
