# Wazuh version, as on main (4.14 installation assistant, agent 4.14.10). The 4.14 assistant installs the
# packages of its own version: the role refuses an assistant of another version. The Windows agents (role
# wazuh_agent) use the same version: an agent must not be newer than its manager.
wazuh_version: '4.14.10'
wazuh_install_script_url: "https://packages.wazuh.com/{{ wazuh_version.rsplit('.', 1)[0] }}/wazuh-install.sh"
wazuh_dir: /opt/wazuh
# Password of the indexer admin user, the dashboard login (the extension credential). Replaces the random
# one of wazuh-install.sh. Set through hash.sh + securityadmin.sh: wazuh-passwords-tool.sh rejects
# passwords without one of .*+?-
wazuh_admin_password: 'Aa1234567890!'
