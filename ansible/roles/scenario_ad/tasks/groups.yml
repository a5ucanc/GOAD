# ad_groups: list of {name, scope (Global|DomainLocal|Universal), member_of (optional list)}, ad_state: present|absent.
- name: "{{ 'Create' if ad_state == 'present' else 'Remove' }} scenario groups"
  ansible.windows.win_powershell:
    script: |
      param([string]$Groups, [string]$State)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      Import-Module ActiveDirectory
      $dn = (Get-ADDomain).DistinguishedName
      foreach ($g in ($Groups | ConvertFrom-Json)) {
        $existing = Get-ADGroup -LDAPFilter "(sAMAccountName=$($g.name))"
        if ($State -eq 'present') {
          if (-not $existing) {
            New-ADGroup -Name $g.name -SamAccountName $g.name -GroupScope $g.scope -GroupCategory Security -Path "CN=Users,$dn"
            $Ansible.Changed = $true
          }
          foreach ($parent in @($g.member_of)) {
            if ($parent -and -not (Get-ADGroupMember -Identity $parent | Where-Object SamAccountName -eq $g.name)) {
              Add-ADGroupMember -Identity $parent -Members $g.name
              $Ansible.Changed = $true
            }
          }
        } elseif ($existing) {
          # memberships disappear with the group
          Remove-ADObject -Identity $existing.DistinguishedName -Confirm:$false
          $Ansible.Changed = $true
        }
      }
    parameters:
      Groups: "{{ ad_groups | to_json }}"
      State: "{{ ad_state }}"
  delegate_to: "{{ dc }}"
