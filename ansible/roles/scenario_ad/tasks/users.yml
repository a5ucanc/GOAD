# ad_users: list of sAMAccountNames, ad_state: present|absent. Users live in CN=Users.
- name: "{{ 'Create' if ad_state == 'present' else 'Remove' }} scenario users"
  ansible.windows.win_powershell:
    script: |
      param([string[]]$Users, [string]$State, [string]$Password)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      Import-Module ActiveDirectory
      $dn = (Get-ADDomain).DistinguishedName
      foreach ($u in $Users) {
        $existing = Get-ADUser -LDAPFilter "(sAMAccountName=$u)"
        if ($State -eq 'present' -and -not $existing) {
          $sec = ConvertTo-SecureString $Password -AsPlainText -Force
          New-ADUser -Name $u -SamAccountName $u -UserPrincipalName "$u@$((Get-ADDomain).DNSRoot)" -Path "CN=Users,$dn" -AccountPassword $sec -Enabled $true -PasswordNeverExpires $true
          $Ansible.Changed = $true
        } elseif ($State -eq 'absent' -and $existing) {
          Remove-ADObject -Identity $existing.DistinguishedName -Recursive -Confirm:$false
          $Ansible.Changed = $true
        }
      }
    parameters:
      Users: "{{ ad_users }}"
      State: "{{ ad_state }}"
      Password: "{{ ad_password | default('Aa1234567890!') }}"
  delegate_to: "{{ dc }}"
