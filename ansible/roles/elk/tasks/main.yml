# Port of main's extensions/elk role elk: Elasticsearch, Kibana and Logstash from Elastic's apt
# repository (Logstash installed but not started: nothing feeds it, and it would take 1 GB of heap), security on without TLS (agents ship over http with a password), the elastic and
# kibana_system passwords set through the API by a file-realm superuser.
- name: Install the apt repository dependencies
  ansible.builtin.apt:
    name: [apt-transport-https, gnupg2]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add the Elastic apt key
  ansible.builtin.get_url:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    dest: /etc/apt/keyrings/elasticsearch.asc
    mode: '0644'

- name: Add the Elastic apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/elasticsearch.asc] https://artifacts.elastic.co/packages/{{ elk_version.split('.')[0] }}.x/apt stable main"
    filename: elastic
    state: present
    update_cache: true

# Pinned: the repository serves every release of the major version. They bundle their own JDK.
- name: Install Elasticsearch, Kibana and Logstash
  ansible.builtin.apt:
    name:
      - "elasticsearch={{ elk_version }}"
      - "kibana={{ elk_version }}"
      - "logstash=1:{{ elk_version }}-1"
    state: present

- name: Configure Kibana
  ansible.builtin.template:
    src: kibana.yml.j2
    dest: /etc/kibana/kibana.yml
    owner: root
    group: kibana
    mode: '0660'
  notify: Restart kibana

- name: Configure Elasticsearch
  ansible.builtin.copy:
    src: elasticsearch.yml
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: '0660'
  notify: Restart elasticsearch

- name: Set the Elasticsearch heap size
  ansible.builtin.copy:
    dest: /etc/elasticsearch/jvm.options.d/heap.options
    content: |
      -Xms{{ elk_heap_size }}
      -Xmx{{ elk_heap_size }}
    owner: root
    group: elasticsearch
    mode: '0660'
  notify: Restart elasticsearch

# The package auto-configuration stores TLS keystore passwords. TLS is off in our elasticsearch.yml, so
# remove them or Elasticsearch refuses the leftover ssl settings.
- name: List the Elasticsearch keystore entries
  ansible.builtin.command: /usr/share/elasticsearch/bin/elasticsearch-keystore list
  register: elk_keystore
  changed_when: false

- name: Remove the auto-configured TLS entries from the Elasticsearch keystore
  ansible.builtin.command: "/usr/share/elasticsearch/bin/elasticsearch-keystore remove {{ item }}"
  loop:
    - xpack.security.http.ssl.keystore.secure_password
    - xpack.security.transport.ssl.keystore.secure_password
    - xpack.security.transport.ssl.truststore.secure_password
  when: item in elk_keystore.stdout_lines
  notify: Restart elasticsearch

- name: List the Elasticsearch file-realm users
  ansible.builtin.command: /usr/share/elasticsearch/bin/elasticsearch-users list
  register: elk_file_users
  changed_when: false

# no_log hides the password on the command line; the next task reports a failure without it.
- name: Create the bootstrap file-realm superuser
  ansible.builtin.command: >-
    /usr/share/elasticsearch/bin/elasticsearch-users useradd {{ elk_bootstrap_user }}
    -p {{ elk_bootstrap_password }} -r superuser
  when: elk_file_users.stdout is not search('^' ~ elk_bootstrap_user ~ '\\s', multiline=True)
  register: elk_useradd
  no_log: true
  ignore_errors: true

- name: Report a failed bootstrap superuser creation
  ansible.builtin.fail:
    msg: "elasticsearch-users useradd failed (rc {{ elk_useradd.rc | default('none') }}): {{ elk_useradd.stderr | default(elk_useradd.msg | default('no message')) }}"
  when: elk_useradd.failed | default(false)

- name: Start and enable Elasticsearch and Kibana
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [elasticsearch, kibana]

- name: Apply a pending Elasticsearch or Kibana restart
  ansible.builtin.meta: flush_handlers

- name: Wait for Elasticsearch
  ansible.builtin.uri:
    url: http://localhost:9200/_cluster/health
    user: "{{ elk_bootstrap_user }}"
    password: "{{ elk_bootstrap_password }}"
    force_basic_auth: true
  register: elk_health
  until: elk_health.status == 200
  retries: 30
  delay: 10

# The items are user names only; uri masks its password option, so no no_log is needed.
# Right after the restart the security index can still answer 503: accept it per attempt and retry
# until 200 or 401. Retries exhausted still fails the task, so a final 503 is never accepted.
- name: Check the built-in users passwords
  ansible.builtin.uri:
    url: http://localhost:9200/_security/_authenticate
    user: "{{ item }}"
    password: "{{ elk_passwords[item] }}"
    force_basic_auth: true
    status_code: [200, 401, 503]
  loop: [elastic, kibana_system]
  register: elk_auth
  until: elk_auth.status | default(0) in [200, 401]
  retries: 30
  delay: 10
  vars:
    elk_passwords: {elastic: "{{ elk_elastic_password }}", kibana_system: "{{ elk_kibana_system_password }}"}

# no_log hides the new password in the request body; the next task reports a failure without it.
- name: Set the built-in users passwords
  ansible.builtin.uri:
    url: "http://localhost:9200/_security/user/{{ item.item }}/_password"
    method: POST
    user: "{{ elk_bootstrap_user }}"
    password: "{{ elk_bootstrap_password }}"
    force_basic_auth: true
    body_format: json
    body:
      password: "{{ elk_passwords[item.item] }}"
  loop: "{{ elk_auth.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.status != 200
  changed_when: true
  register: elk_set_passwords
  no_log: true
  ignore_errors: true
  vars:
    elk_passwords: {elastic: "{{ elk_elastic_password }}", kibana_system: "{{ elk_kibana_system_password }}"}

# Not a loop over the results: a fail item would print the whole registered result.
- name: Report a failed password change
  ansible.builtin.fail:
    msg: >-
      {% for r in elk_failed %}setting the {{ r.item.item }} password failed: HTTP {{ r.status | default('none') }}
      {{ r.msg | default('') }} {{ r.json | default('') }}; {% endfor %}
  when: elk_failed | length > 0
  vars:
    elk_failed: "{{ elk_set_passwords.results | selectattr('failed', 'defined') | selectattr('failed') | list }}"

# Winlogbeat setup on the Windows hosts loads its dashboards through Kibana: wait until Kibana serves.
- name: Wait for Kibana
  ansible.builtin.uri:
    url: http://localhost:5601/api/status
    user: elastic
    password: "{{ elk_elastic_password }}"
    force_basic_auth: true
  register: elk_kibana
  until: elk_kibana.status == 200
  retries: 60
  delay: 10
