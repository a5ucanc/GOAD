# elk_version and elk_elastic_password: ansible/group_vars/all/monitoring.yml (shared with role elk_agent).
# Elasticsearch heap. Keep it at most half of the VM memory (6144 MB, extensions/elk.yml).
elk_heap_size: 2g
# Password of the built-in kibana_system user (Kibana to Elasticsearch connection).
elk_kibana_system_password: 'Aa1234567890!'
# File-realm superuser used only by ansible to set the built-in users passwords.
elk_bootstrap_user: goad_bootstrap
elk_bootstrap_password: 'Aa1234567890!'
