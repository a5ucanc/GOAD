---
# Configure DPM : attach the protected server, add backup storage and create a protection group that
# backs up the protected server's data.
# https://learn.microsoft.com/azure/backup/backup-dpm-automation (DPM PowerShell cmdlets)
# https://learn.microsoft.com/system-center/dpm/add-storage?view=sc-dpm-2022 (Modern Backup Storage)
# https://learn.microsoft.com/powershell/module/dataprotectionmanager/add-dpmdiskstorage (MBS volume)
# --------------------------------------------------------------

# Load datas
- import_playbook: data.yml
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'

- name: "Configure DPM protection"
  hosts: dpm
  roles:
    - { role: 'dpm/config/protection_group', tags: 'dpm_config'}
  vars:
    domain: "{{lab.hosts[dict_key].domain}}"
    domain_username: "{{domain}}\\{{admin_user}}"
    domain_password: "{{lab.domains[domain].domain_password}}"
    dpm_server_name: "{{ lab.hosts[dict_key].hostname }}"
    protected_host: "{{ groups['dpm_agent'][0] }}"
    protected_server_name: "{{ lab.hosts[protected_host].hostname }}"
    protected_server_fqdn: "{{ protected_server_name }}.{{ lab.hosts[protected_host].domain }}"
