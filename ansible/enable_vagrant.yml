- name: "Enable vagrant"
  hosts: domain
  gather_facts: no
  pre_tasks:
    # the vagrant gate may have just booted the VMs (vmrun start): wait for WinRM
    - name: "Wait for the host"
      ansible.builtin.wait_for_connection:
        timeout: 900
  roles:
    - { role: 'enable_user', tags: 'enable_vagrant', username: "vagrant"}

- name: "Enable vagrant"
  hosts: linux_domain
  gather_facts: no
  become: yes
  pre_tasks:
    - name: "Wait for the host"
      ansible.builtin.wait_for_connection:
        timeout: 900
  roles:
    - { role: 'linux/enable_user', tags: 'enable_vagrant', username: "vagrant"}
