# Reset the Windows clocks after a snapshot revert: a restored VM resumes with the clock of the
# snapshot, and the root DC (time source Local CMOS Clock) never corrects it. The controller's UTC
# time is the reference.
- name: "Sync clocks with the controller"
  hosts: domain
  gather_facts: no
  vars:
    controller_utc: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
  tasks:
    - name: "Set the clock from the controller UTC time"
      ansible.windows.win_powershell:
        script: |
          param([string]$Utc)
          $wanted = [DateTime]::Parse($Utc, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::AdjustToUniversal)
          $Ansible.Changed = [Math]::Abs(([DateTime]::UtcNow - $wanted).TotalSeconds) -gt 5
          if ($Ansible.Changed) { Set-Date -Date $wanted.ToLocalTime() | Out-Null }
        parameters:
          Utc: "{{ controller_utc }}"
